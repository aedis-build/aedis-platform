# Site (Next.js standalone, imagem distroless non-root) em qualquer Kubernetes: nginx, sem segredos, sem framework.
name: portal
namespace: web
type: site
owner: web-team
environment: dev
environmentClass: nonprod
cloud:
  provider: generic
image:
  repository: ghcr.io/example/portal
  tag: 1.2.0-rc.1
# uid/gid nonroot das imagens gcr.io/distroless/*:nonroot.
security:
  uid: 65532
  gid: 65532
  writablePaths:
    - path: /app/.next/cache
      sizeLimit: 256Mi
ingress:
  enabled: true
  preset: nginx
  hosts: [portal.dev.example.com]
  tls:
    secretName: portal-dev-tls
  proxyNetworks: [10.0.0.0/8]
  edge:
    waf: false
observability:
  metrics:
    enabled: false
networkPolicy:
  egress:
    enabled: true
    allowedCidrs: [10.20.0.0/16]
  ingress:
    enabled: true
    controllerNamespaces: [ingress-nginx]
