{{- $i := .Values.identity }}
{{- $ann := deepCopy ($i.annotations | default dict) }}
{{- if $i.enabled }}
{{- if eq .Values.cloud.provider "aws" }}
{{- $_ := set $ann "eks.amazonaws.com/role-arn" (include "aedis.awsRoleArn" .) }}
{{- else if eq .Values.cloud.provider "azure" }}
{{- $_ := set $ann "azure.workload.identity/client-id" (required "identity.azure.clientId é obrigatório com identity.enabled em azure" $i.azure.clientId) }}
{{- with $i.azure.tenantId }}{{- $_ := set $ann "azure.workload.identity/tenant-id" . }}{{- end }}
{{- else }}
{{- fail (printf "identity.enabled não tem efeito em cloud.provider=%s (só aws e azure); desligue ou use annotations" .Values.cloud.provider) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aedis.serviceAccountName" . }}
  namespace: {{ include "aedis.namespace" . }}
  labels:
    {{- include "aedis.labels" . | nindent 4 }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $i.automountToken }}
