{{- /*
ExternalSecret -> Secret <name>-secret (envFrom). O remoteRef.key segue a convenção do provider:
  aws   : <prefix>/<key>   (segredo JSON; property = chave)
  azure : <prefix>-<key>   (Key Vault só aceita [A-Za-z0-9-]; '/' e '_' viram '-')
  vault : <prefix>/<key>   (KV v2; property obrigatório)
  generic: <key> com prefixo quando informado
secrets.keyTemplate sobrescreve a convenção (tpl com .prefix, .key, .provider).
*/ -}}
{{- define "aedis.secrets.remoteKey" -}}
{{- $p := .provider -}}
{{- $prefix := .prefix -}}
{{- $key := .key -}}
{{- if .template -}}
{{ tpl .template (dict "prefix" $prefix "key" $key "provider" $p) }}
{{- else if eq $p "azure" -}}
{{ regexReplaceAll "[^A-Za-z0-9-]" (ternary (printf "%s-%s" $prefix $key) $key (ne $prefix "")) "-" }}
{{- else -}}
{{ ternary (printf "%s/%s" $prefix $key) $key (ne $prefix "") }}
{{- end -}}
{{- end -}}

{{- define "aedis.secrets.data" -}}
{{- $ctx := .ctx -}}
{{- $provider := include "aedis.secretsProvider" $ctx -}}
{{- $s := $ctx.Values.secrets -}}
{{- range .keys }}
{{- $key := required "secrets.keys[].key é obrigatório" .key }}
{{- if and (eq $provider "vault") (not .property) }}{{ fail (printf "secrets.keys[%s]: property é obrigatório no Vault (campo dentro do segredo KV)" .name) }}{{ end }}
- secretKey: {{ required "secrets.keys[].name é obrigatório" .name }}
  remoteRef:
    key: {{ include "aedis.secrets.remoteKey" (dict "provider" $provider "prefix" $s.prefix "key" $key "template" ($ctx.Values.secrets.keyTemplate | default (tpl "{{ .template | default \"\" }}" (dict "template" .keyTemplate)))) }}
    {{- with .property }}
    property: {{ . }}
    {{- end }}
    conversionStrategy: Default
    decodingStrategy: None
    metadataPolicy: None
{{- end }}
{{- end -}}

{{- $name := include "aedis.name" . }}
{{- $ns := include "aedis.namespace" . }}
{{- $s := .Values.secrets }}
{{- $provider := include "aedis.secretsProvider" . }}
{{- if or $s.keys $s.dataFrom }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "aedis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.store.name é obrigatório" $s.store.name }}
    kind: {{ $s.store.kind }}
  target:
    name: {{ $name }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- with $s.dataFrom }}
  dataFrom:
    {{- range . }}
    - extract:
        key: {{ include "aedis.secrets.remoteKey" (dict "provider" $provider "prefix" $s.prefix "key" (required "secrets.dataFrom[].key é obrigatório" .key) "template" $s.keyTemplate) }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
  {{- end }}
  {{- with $s.keys }}
  data:
    {{- include "aedis.secrets.data" (dict "ctx" $ "keys" .) | trim | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $s.extra }}
{{- $extra := required "secrets.extra[].name é obrigatório" .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-{{ $extra }}
  namespace: {{ $ns }}
  labels:
    {{- include "aedis.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    name: {{ $s.store.name }}
    kind: {{ $s.store.kind }}
  target:
    name: {{ $name }}-{{ $extra }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- include "aedis.secrets.data" (dict "ctx" $ "keys" (required "secrets.extra[].keys é obrigatório" .keys)) | trim | nindent 4 }}
{{- end }}
