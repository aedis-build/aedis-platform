{{- $eg := .Values.networkPolicy.egress }}
{{- if $eg.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aedis.name" . }}-egress
  namespace: {{ include "aedis.namespace" . }}
  labels:
    {{- include "aedis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aedis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $eg.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if $eg.allowedCidrs }}
    - to:
        {{- range $eg.allowedCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $eg.blockedCidrs }}
              - {{ . }}
              {{- end }}
    {{- with $eg.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- $in := .Values.networkPolicy.ingress }}
{{- if and $in.enabled (ne .Values.type "cronjob") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aedis.name" . }}-ingress
  namespace: {{ include "aedis.namespace" . }}
  labels:
    {{- include "aedis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aedis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range $in.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range $in.controllerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range $in.sourceCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}
    {{- with $in.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
