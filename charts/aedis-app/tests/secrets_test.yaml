suite: ExternalSecret por provider
templates:
  - externalsecret.yaml
tests:
  - it: Vault usa prefixo/chave e exige property
    values:
      - ../ci/api-generic-nginx.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: aedis-secrets
      - equal:
          path: spec.target.name
          value: orders-api-secret
      - equal:
          path: spec.data[0].remoteRef.key
          value: apps/dev/orders-api
      - equal:
          path: spec.data[0].remoteRef.property
          value: ConnectionString

  - it: Vault sem property falha
    values:
      - ../ci/api-generic-nginx.yaml
    set:
      secrets.keys:
        - name: X
          key: orders-api
    asserts:
      - failedTemplate:
          errorPattern: "property é obrigatório no Vault"

  - it: AWS usa prefixo/chave, aceita dataFrom e property opcional
    values:
      - ../ci/api-aws-alb-datadog.yaml
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: prod/payments-api
      - equal:
          path: spec.data[0].remoteRef.key
          value: prod/payments-api/signing

  - it: Azure junta prefixo e chave com hífen e normaliza caracteres inválidos
    values:
      - ../ci/worker-azure-keda.yaml
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: staging-notifications-servicebus-namespace
      - isNull:
          path: spec.data[0].remoteRef.property

  - it: keyTemplate sobrescreve a convenção
    values:
      - ../ci/api-generic-nginx.yaml
    set:
      secrets.keyTemplate: "legacy/{{ .key }}/{{ .prefix }}"
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: legacy/orders-api/apps/dev

  - it: secrets.extra gera ExternalSecret e Secret próprios
    values:
      - ../ci/api-generic-nginx.yaml
    set:
      secrets.extra:
        - name: keda
          keys:
            - name: RABBITMQ_HOST
              key: keda
              property: AmqpUrl
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: orders-api-keda
        documentIndex: 1
      - equal:
          path: spec.target.name
          value: orders-api-keda
        documentIndex: 1

  - it: sem chaves não gera ExternalSecret
    values:
      - ../ci/cronjob-generic.yaml
    asserts:
      - hasDocuments:
          count: 0
