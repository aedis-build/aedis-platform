suite: presets de ingress
templates:
  - ingress.yaml
  - ingress-kong.yaml
tests:
  - it: nginx força TLS e usa a classe nginx
    template: ingress.yaml
    values:
      - ../ci/api-generic-nginx.yaml
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "true"
      - equal:
          path: spec.tls[0].secretName
          value: orders-dev-tls
      - equal:
          path: spec.rules[0].host
          value: orders.dev.example.com

  - it: ALB usa target-type ip, healthcheck na readiness e TLS 1.3
    template: ingress.yaml
    values:
      - ../ci/api-aws-alb-datadog.yaml
    asserts:
      - equal:
          path: spec.ingressClassName
          value: alb
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/target-type"]
          value: ip
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/healthcheck-path"]
          value: /health/ready
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/ssl-policy"]
          value: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/group.name"]
          value: prod-public

  - it: AGIC usa a classe do Application Gateway e a sonda na readiness
    template: ingress.yaml
    values:
      - ../ci/api-azure-agic.yaml
    asserts:
      - equal:
          path: spec.ingressClassName
          value: azure-application-gateway
      - equal:
          path: metadata.annotations["appgw.ingress.kubernetes.io/health-probe-path"]
          value: /health/ready
      - equal:
          path: metadata.annotations["appgw.ingress.kubernetes.io/appgw-ssl-certificate"]
          value: billing-cert

  - it: anotações do app sobrescrevem as do preset
    template: ingress.yaml
    values:
      - ../ci/api-generic-nginx.yaml
    set:
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 100m
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: 100m

  - it: Kong gera uma Ingress por rota com os métodos e os plugins da rota
    template: ingress-kong.yaml
    values:
      - ../ci/api-kong.yaml
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: KongUpstreamPolicy
        documentIndex: 0
      - isKind:
          of: KongPlugin
        documentIndex: 1
      - equal:
          path: metadata.name
          value: catalog-api-v1-catalog-products
        documentIndex: 2
      - equal:
          path: metadata.annotations["konghq.com/methods"]
          value: GET, QUERY
        documentIndex: 2
      - equal:
          path: metadata.annotations["konghq.com/plugins"]
          value: catalog-api-rate-limit
        documentIndex: 2
      - equal:
          path: metadata.annotations["konghq.com/methods"]
          value: POST
        documentIndex: 3
      - isNull:
          path: metadata.annotations["konghq.com/plugins"]
        documentIndex: 3

  - it: Kong com plugin não declarado falha
    template: ingress-kong.yaml
    values:
      - ../ci/api-kong.yaml
    set:
      ingress.routes:
        - path: /x
          methods: [GET]
          plugins: [nao-existe]
    asserts:
      - failedTemplate:
          errorPattern: "plugin nao-existe não declarado"

  - it: worker não ganha Ingress mesmo com ingress.enabled
    template: ingress.yaml
    values:
      - ../ci/worker-azure-keda.yaml
    set:
      ingress.enabled: true
      ingress.hosts: [x.example.com]
      ingress.edge.waf: false
    asserts:
      - hasDocuments:
          count: 0
