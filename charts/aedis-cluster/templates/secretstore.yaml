{{- $s := .Values.secretStore }}
{{- if $s.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $s.name }}
  labels:
    app.kubernetes.io/part-of: aedis
spec:
  provider:
    {{- if eq $s.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "secretStore.aws.region é obrigatório" $s.aws.region }}
      {{- with $s.aws.role }}
      role: {{ . }}
      {{- end }}
    {{- else if eq $s.provider "azure" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secretStore.azure.vaultUrl é obrigatório" $s.azure.vaultUrl }}
      {{- with $s.azure.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      serviceAccountRef:
        name: {{ $s.azure.serviceAccountName }}
        namespace: {{ $s.azure.serviceAccountNamespace }}
    {{- else if eq $s.provider "vault" }}
    vault:
      server: {{ required "secretStore.vault.server é obrigatório" $s.vault.server }}
      path: {{ $s.vault.path }}
      version: {{ $s.vault.version }}
      auth:
        kubernetes:
          mountPath: {{ $s.vault.mountPath }}
          role: {{ $s.vault.kubernetesRole }}
          serviceAccountRef:
            name: {{ $s.vault.serviceAccountName }}
            namespace: {{ $s.vault.serviceAccountNamespace }}
    {{- else }}
    {{- fail (printf "secretStore.provider '%s' desconhecido (aws | azure | vault)" $s.provider) }}
    {{- end }}
{{- end }}
