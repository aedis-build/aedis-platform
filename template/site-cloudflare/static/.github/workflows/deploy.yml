# Deploy na borda da Cloudflare pelo reutilizável deploy-site do Aedis Platform: build isolado, SBOM, atestação
# (SLSA Build L3) e publicação exatamente dos bytes atestados, seguida do smoke test. Os segredos ficam no environment
# prd do GitHub (só main, aprovador obrigatório) e são declarados um a um: nunca `secrets: inherit`.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: aedis-build/aedis-platform/.github/workflows/deploy-site.yml@__AEDIS_PLATFORM_PIN__
    # pull-requests e actions são dos jobs de preview e rollback do reutilizável: o GitHub as exige mesmo sem rodá-los.
    permissions:
      contents: read
      id-token: write
      attestations: write
      pull-requests: write
      actions: read
    with:
      type: static
      name: __AEDIS_NAME__
      url: https://__AEDIS_DOMAIN__
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_HEADER: ${{ secrets.SMOKE_HEADER }}
