# CI do site: o pipeline único do Aedis Platform (aedis-ci) com language node. Conventional Commits, testes com
# cobertura e gate (85 % linhas, 70 % branches, sem regressão), SAST (Semgrep + regras Aedis para TypeScript/React),
# CodeQL, REUSE e DAST (ZAP) contra o site servido pelo `wrangler dev` (o mesmo runtime e o mesmo _headers da borda).
# O deploy, com SBOM e atestação, sai do deploy.yml.
name: aedis-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

# Uma execução por pull request: um push novo ou fechar o PR cancela a que está rodando. Push na main e o
# agendamento nunca dividem grupo (run_id), então essas execuções sempre terminam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  aedis:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@__AEDIS_PLATFORM_PIN__
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: node
      min-line: 85
      min-branch: 70
      no-regression: true
      dast-start: "pnpm build:worker && (WRANGLER_SEND_METRICS=false pnpm start > dast-server.log 2>&1 &)"
