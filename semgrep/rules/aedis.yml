# Regras SAST conscientes do framework Aedis (C#/JSON) e do Aedis UI (TypeScript/React). Complementam os rulesets
# públicos (p/owasp-top-ten, p/secrets, p/csharp e, em repositórios JS, p/javascript p/typescript p/react via
# extra-configs). Cada regra tem fixture em semgrep/tests (semgrep --test). Sem regras de negócio.
rules:
  - id: aedis.enable-authentication-false
    languages: [csharp]
    severity: ERROR
    message: "Host com EnableAuthentication desligado: fora de Development o AedisApiHost recusa iniciar; em Development expõe tudo sem login. Remova o override."
    metadata: { category: security, cwe: "CWE-306", owasp: "A07:2021", aedis-control: PLT-13 }
    pattern-regex: '(?m)^(?!\s*//).*EnableAuthentication\s*=>\s*false'

  - id: aedis.swagger-enabled-unconditionally
    languages: [csharp]
    severity: WARNING
    message: "Swagger ligado sem condição de ambiente expõe o contrato da API em produção. Condicione a Development ou remova."
    metadata: { category: security, cwe: "CWE-200", aedis-control: PLT-13 }
    pattern-regex: '(?m)^(?!\s*//).*EnableSwagger\s*=>\s*true'

  - id: aedis.allow-anonymous-on-write-verb
    languages: [csharp]
    severity: ERROR
    message: "[AllowAnonymous] em verbo de escrita ($VERB): qualquer um grava sem autenticação. Use [Authorize] ou um fluxo explícito de credencial."
    metadata: { category: security, cwe: "CWE-306", owasp: "A01:2021", aedis-control: PLT-13 }
    patterns:
      - pattern-either:
          - pattern: |
              [AllowAnonymous]
              [$VERB(...)]
              $RET $M(...) { ... }
          - pattern: |
              [$VERB(...)]
              [AllowAnonymous]
              $RET $M(...) { ... }
          - pattern: |
              [AllowAnonymous]
              [$VERB]
              $RET $M(...) { ... }
          - pattern: |
              [$VERB]
              [AllowAnonymous]
              $RET $M(...) { ... }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(HttpPost|HttpPut|HttpPatch|HttpDelete)$

  - id: aedis.dapper-sql-interpolation
    languages: [csharp]
    severity: ERROR
    message: "SQL montado por interpolação/concatenação em $M: injeção de SQL. Use parâmetros (new { ... }) ou os critérios do Aedis.Database."
    metadata: { category: security, cwe: "CWE-89", owasp: "A03:2021", aedis-control: PLT-13 }
    patterns:
      - pattern-either:
          - pattern: $X.$M($"...", ...)
          - pattern: $X.$M<$T>($"...", ...)
          - pattern: $X.$M($A + $B, ...)
          - pattern: $X.$M<$T>($A + $B, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(Query|QueryAsync|QueryFirst|QueryFirstAsync|QueryFirstOrDefault|QueryFirstOrDefaultAsync|QuerySingle|QuerySingleAsync|QuerySingleOrDefault|QuerySingleOrDefaultAsync|QueryMultiple|QueryMultipleAsync|Execute|ExecuteAsync|ExecuteScalar|ExecuteScalarAsync|ExecuteReader|ExecuteReaderAsync)$

  - id: aedis.tls-validation-disabled
    languages: [csharp]
    severity: ERROR
    message: "Validação do certificado TLS desligada: aceita qualquer servidor (MITM). Confie na CA ou fixe o certificado via HttpClientProfile."
    metadata: { category: security, cwe: "CWE-295", owasp: "A02:2021", aedis-control: PLT-13 }
    pattern-either:
      - pattern: $H.ServerCertificateCustomValidationCallback = (...) => true;
      - pattern: $H.ServerCertificateCustomValidationCallback = HttpClientHandler.DangerousAcceptAnyServerCertificateValidator;
      - pattern: ServicePointManager.ServerCertificateValidationCallback = (...) => true;
      - pattern: $H.ServerCertificateValidationCallback = (...) => true;

  - id: aedis.insecure-deserialization
    languages: [csharp]
    severity: ERROR
    message: "Desserialização insegura ($X): permite execução de código a partir de dados externos."
    metadata: { category: security, cwe: "CWE-502", owasp: "A08:2021", aedis-control: PLT-13 }
    pattern-either:
      - pattern: new BinaryFormatter()
      - pattern: TypeNameHandling.All
      - pattern: TypeNameHandling.Objects
      - pattern: TypeNameHandling.Auto
      - pattern: TypeNameHandling.Arrays

  - id: aedis.sensitive-data-in-log
    languages: [csharp]
    severity: WARNING
    message: "Valor sensível ($ARG) passado ao log. A redaction do Aedis mascara por nome de propriedade, não argumentos posicionais; não logue o valor."
    metadata: { category: security, cwe: "CWE-532", owasp: "A09:2021", aedis-control: PLT-13 }
    patterns:
      - pattern: $LOG.$M(..., $ARG, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^Log(Trace|Debug|Information|Warning|Error|Critical)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)^[\w.]*(password|passwd|secret|token|apikey|api_key|connectionstring)[\w.]*$

  - id: aedis.cors-any-origin-with-credentials
    languages: [csharp]
    severity: ERROR
    message: "CORS com AllowAnyOrigin e AllowCredentials: o navegador recusa e a intenção é insegura. Liste as origens (Security:Cors:AllowedOrigins)."
    metadata: { category: security, cwe: "CWE-942", owasp: "A05:2021", aedis-control: PLT-13 }
    pattern-regex: 'AllowAnyOrigin\(\)[\s\S]{0,300}?AllowCredentials\(\)|AllowCredentials\(\)[\s\S]{0,300}?AllowAnyOrigin\(\)'

  - id: aedis.trust-all-proxies-in-config
    languages: [json]
    severity: WARNING
    message: "Security:ForwardedHeaders:TrustAllProxies=true em configuração versionada: X-Forwarded-For de qualquer origem é aceito (spoofing de IP). Deixe o chart fixar KnownNetworks."
    metadata: { category: security, cwe: "CWE-348", owasp: "A05:2021", aedis-control: PLT-12 }
    pattern-regex: '"TrustAllProxies"\s*:\s*true'

  - id: aedis.hsts-disabled-in-config
    languages: [json]
    severity: WARNING
    message: "HSTS desligado em configuração versionada. Em produção o chart liga; não fixe false no appsettings.json."
    metadata: { category: security, cwe: "CWE-319", owasp: "A02:2021", aedis-control: PLT-12 }
    pattern-regex: '"EnableHsts"\s*:\s*false'

  - id: aedis.secret-in-config
    languages: [json]
    severity: ERROR
    message: "Valor que parece segredo ($1) em appsettings versionado. Segredos vêm do cofre (ExternalSecret / Aedis.Secrets), nunca do git."
    metadata: { category: security, cwe: "CWE-798", owasp: "A07:2021", aedis-control: PLT-02 }
    paths: { exclude: ["appsettings.Development.json"] }
    pattern-regex: '"(ConnectionString|Password|ClientSecret|ApiKey|Secret|Token|AccessKey|SecretAccessKey|PrivateKeyPem)"\s*:\s*"(?!\s*"|\$\{)[^"]{6,}"'

  # Regras JavaScript/TypeScript (React). Repositórios JS chamam sast.yml com extra-configs: p/javascript p/typescript p/react.
  - id: aedis.dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: ERROR
    message: "dangerouslySetInnerHTML turns text into markup. Agent and user content is data: render it as text or through the Markdown component."
    metadata: { category: security, cwe: "CWE-79", owasp: "A03:2021", aedis-control: PLT-13 }
    pattern-regex: 'dangerouslySetInnerHTML'

  - id: aedis.rehype-raw
    languages: [typescript, javascript]
    severity: ERROR
    message: "rehype-raw renders raw HTML inside markdown, which defeats the Markdown component's protection. Remove it."
    metadata: { category: security, cwe: "CWE-79", owasp: "A03:2021", aedis-control: PLT-13 }
    pattern-regex: 'from\s+["'']rehype-raw["'']|require\(\s*["'']rehype-raw["'']\s*\)'

  - id: aedis.secret-in-web-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: "A token or session in localStorage/sessionStorage is readable by any script on the page. Keep the session in an HttpOnly cookie and call the backend with api()."
    metadata: { category: security, cwe: "CWE-922", owasp: "A07:2021", aedis-control: PLT-13 }
    pattern-regex: '(?i)(localStorage|sessionStorage)\.setItem\(\s*["''][^"'']*(token|jwt|secret|session|password|credential)'

  - id: aedis.fetch-credentials-include
    languages: [typescript, javascript]
    severity: WARNING
    message: "credentials: \"include\" sends the session cookie to another origin. Call your own backend with api(), which stays same-origin."
    metadata: { category: security, cwe: "CWE-200", aedis-control: PLT-13 }
    pattern-regex: 'credentials:\s*["'']include["'']'

  - id: aedis.raw-text-field
    languages: [typescript, javascript]
    severity: WARNING
    message: "A raw <input> or <textarea> has no length limit unless you remember one. Use @aedis/input or @aedis/textarea, which are bounded by default."
    metadata: { category: security, cwe: "CWE-20", aedis-control: PLT-13 }
    pattern-regex: '<(textarea|input)\b'
    paths:
      exclude:
        - "**/registry/aedis/ui/input.tsx"
        - "**/registry/aedis/ui/textarea.tsx"

  - id: aedis.open-redirect
    languages: [csharp]
    severity: ERROR
    message: "Redirecionamento para URL que não é literal: com entrada externa vira open redirect (phishing com o domínio da app). Use LocalRedirect, confira Url.IsLocalUrl ou redirecione só para destinos de uma lista."
    metadata: { category: security, cwe: "CWE-601", owasp: "A01:2021", aedis-control: PLT-13 }
    patterns:
      - pattern-either:
          - pattern: Redirect($URL)
          - pattern: RedirectPermanent($URL)
          - pattern: $RESP.Redirect($URL, ...)
          - pattern: Results.Redirect($URL, ...)
          - pattern: TypedResults.Redirect($URL, ...)
      - pattern-not: Redirect("...")
      - pattern-not: RedirectPermanent("...")
      - pattern-not: $RESP.Redirect("...", ...)
      - pattern-not: Results.Redirect("...", ...)
      - pattern-not: TypedResults.Redirect("...", ...)
      - pattern-not-inside: |
          if (<... Url.IsLocalUrl($URL) ...>) { ... }

  - id: aedis.cookie-missing-flags
    languages: [csharp]
    severity: ERROR
    message: "CookieOptions sem Secure = true, HttpOnly = true e SameSite Strict ou Lax: o cookie trafega em HTTP, fica legível por script ou acompanha requisições de outros sites (CSRF). Defina os três."
    metadata: { category: security, cwe: "CWE-614", owasp: "A05:2021", aedis-control: PLT-13 }
    pattern-regex: '(?m)^(?!\s*//).*new\s+CookieOptions\s*(?:\(\s*\))?\s*(?:\{(?:(?![^}]*\bSecure\s*=\s*true)|(?![^}]*\bHttpOnly\s*=\s*true)|(?![^}]*\bSameSite\s*=\s*SameSiteMode\.(?:Strict|Lax)\b))[^}]*\}|(?!\s*\{))'

  - id: aedis.jwt-validation-disabled
    languages: [csharp]
    severity: ERROR
    message: "Validação de JWT desligada ($0): um token de outro emissor, de outra audiência, expirado ou sem assinatura passa a valer. O AedisApiHost já configura a validação; não sobrescreva."
    metadata: { category: security, cwe: "CWE-347", owasp: "A07:2021", aedis-control: PLT-13 }
    pattern-regex: '(?m)^(?!\s*//).*\b(?:ValidateIssuer|ValidateAudience|ValidateLifetime|ValidateIssuerSigningKey|RequireSignedTokens|RequireExpirationTime)\s*=\s*false\b'

  - id: aedis.developer-exception-page
    languages: [csharp]
    severity: ERROR
    message: "UseDeveloperExceptionPage fora de um if de Development: em produção a resposta de erro leva stack trace e detalhes internos. O AedisApiHost responde ProblemDetails sem vazar nada."
    metadata: { category: security, cwe: "CWE-209", owasp: "A05:2021", aedis-control: PLT-13 }
    patterns:
      - pattern: $APP.UseDeveloperExceptionPage(...)
      - pattern-not-inside: |
          if (<... $E.IsDevelopment() ...>) { ... }

  - id: aedis.eval
    languages: [typescript, javascript]
    severity: ERROR
    message: "eval or new Function runs a string as code: any untrusted part becomes script execution, and the strict CSP of Aedis UI blocks it anyway. Parse data with JSON.parse and keep code static."
    metadata: { category: security, cwe: "CWE-95", owasp: "A03:2021", aedis-control: PLT-13 }
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
