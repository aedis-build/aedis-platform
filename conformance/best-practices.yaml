# Critérios do selo OpenSSF Best Practices (bestpractices.dev) traduzidos em itens verificáveis num repositório
# GitHub e na organização. Lido por `aedis platform validate --level N`, por `aedis org audit` e pelo portal.
# Nível do selo exigido por nível de conformidade: L1 passing, L2 silver, L3 gold. Os textos dos critérios ficam
# em inglês porque saem nos relatórios entregues à organização e a auditores.
schema: aedis.platform/best-practices/v1
tiers:
  passing:
    - id: BP-01
      criterion: Published vulnerability policy (SECURITY.md with a private reporting channel)
      check: file-exists
      path: SECURITY.md
    - id: BP-02
      criterion: OSI-approved license in the repository
      check: file-exists
      path: LICENSE
    - id: BP-03
      criterion: Contribution guide
      check: file-exists
      path: CONTRIBUTING.md
    - id: BP-04
      criterion: Automated tests run in CI
      check: workflow-exists
      path: .github/workflows
    - id: BP-05
      criterion: Static analysis in CI (CodeQL or Semgrep)
      check: workflow-uses
      pattern: "codeql-action|sast.yml|semgrep"
    - id: BP-06
      criterion: Dependencies updated automatically (Dependabot/Renovate)
      check: file-exists
      path: .github/dependabot.yml
    - id: BP-07
      criterion: Default branch protected, changes only through reviewed pull requests
      check: ruleset-as-code
      path: .github/rulesets/main.json
  silver:
    - id: BP-11
      criterion: Signed releases (cosign on images/charts, provenance)
      check: workflow-uses
      pattern: "cosign"
    - id: BP-12
      criterion: Pinned dependencies (actions pinned by SHA)
      check: actions-pinned-by-sha
    - id: BP-13
      criterion: Test coverage measured with a threshold
      check: workflow-uses
      pattern: "coverage.yml"
    - id: BP-15
      criterion: Conventional Commits and linear history
      check: workflow-uses
      pattern: "conventional-commits.yml"
  gold:
    - id: BP-21
      criterion: Two or more maintainers with mandatory code owner review
      check: manual
    - id: BP-22
      criterion: SBOM published for every release
      check: workflow-uses
      pattern: "sbom"
    - id: BP-23
      criterion: Reproducible builds or verifiable provenance (SLSA)
      check: workflow-uses
      pattern: "provenance"
    - id: BP-24
      criterion: Dynamic testing (DAST) against the exposed surface
      check: workflow-uses
      pattern: "actions/dast@|dast\\.yml"
    - id: BP-25
      criterion: Evidence retained and risk acceptances reviewed periodically
      check: manual
# Controles avaliados uma vez na organização (GET /orgs/{org}, permissões de workflow do Actions, rulesets de org).
# `aedis org audit --apply` aplica os que têm API de escrita; 2FA só se liga na UI da organização.
organization:
  - id: ORG-01
    tier: passing
    criterion: GitHub Actions default workflow token is read-only
    check: org-field
    source: workflow
    field: default_workflow_permissions
    expected: read
  - id: ORG-02
    tier: passing
    criterion: GitHub Actions cannot approve pull requests
    check: org-field
    source: workflow
    field: can_approve_pull_request_reviews
    expected: "false"
  - id: ORG-03
    tier: passing
    criterion: Dependabot alerts enabled for new repositories
    check: org-field
    field: dependabot_alerts_enabled_for_new_repositories
    expected: "true"
  - id: ORG-04
    tier: silver
    criterion: Two-factor authentication required for all members
    check: org-field
    field: two_factor_requirement_enabled
    expected: "true"
  - id: ORG-05
    tier: silver
    criterion: Dependabot security updates enabled for new repositories
    check: org-field
    field: dependabot_security_updates_enabled_for_new_repositories
    expected: "true"
  - id: ORG-06
    tier: silver
    criterion: Organization ruleset protects the default branch of every repository
    check: org-ruleset
  - id: ORG-07
    tier: gold
    criterion: Secret scanning enabled for new repositories
    check: org-field
    field: secret_scanning_enabled_for_new_repositories
    expected: "true"
  - id: ORG-08
    tier: gold
    criterion: Secret scanning push protection enabled for new repositories
    check: org-field
    field: secret_scanning_push_protection_enabled_for_new_repositories
    expected: "true"
  - id: ORG-09
    tier: gold
    criterion: Only owners can create public repositories
    check: org-field
    field: members_can_create_public_repositories
    expected: "false"
