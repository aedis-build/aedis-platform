# Níveis de conformidade do Aedis Platform. Lido por `aedis platform validate --level N` e pelo portal.
# Um tenant pode copiar este arquivo para conformance/levels.yaml no repo GitOps e SUBIR limiares; nunca baixar.
# Cada controle tem: id, descrição, como é verificado (source) e o que o checker consegue avaliar localmente.
schema: aedis.platform/conformance-levels/v1
levels:
  - id: 1
    name: Baseline
    scorecard:
      minScore: 0
      checks:
        Token-Permissions: 1
        Dangerous-Workflow: 1
        Binary-Artifacts: 1
    bestPractices: passing
    coverage:
      minLine: 60
      minBranch: 0
      noRegression: false
    controls:
      - id: PLT-01
        title: Baseline de pod (non-root, read-only, sem capabilities, seccomp)
        source: chart
        check: chart-baseline
      - id: PLT-02
        title: Segredos fora do git (ExternalSecret)
        source: chart
        check: secrets-via-eso
      - id: PLT-05
        title: Manifestos validados (schema, kubeconform, Trivy config)
        source: validate-summary
        check: validate-pass
      - id: PLT-17
        title: Probes de liveness/readiness/startup
        source: chart
        check: probes-enabled
      - id: PLT-18
        title: PDB para APIs com 2+ réplicas
        source: chart
        check: pdb-present
  - id: 2
    name: Hardened
    scorecard:
      minScore: 7
      checks:
        Branch-Protection: 8
        Code-Review: 8
        Pinned-Dependencies: 8
        SAST: 8
        Vulnerabilities: 8
    bestPractices: silver
    coverage:
      minLine: 75
      minBranch: 60
      noRegression: true
    controls:
      - id: PLT-06
        title: Imagem assinada (cosign) e verificada no admission
        source: build-image-summary
        check: image-signed
      - id: PLT-07
        title: SBOM e proveniência anexados
        source: build-image-summary
        check: sbom-attached
      - id: PLT-08
        title: Produção referencia imagem por digest
        source: chart
        check: prod-digest
      - id: PLT-09
        title: Kyverno em enforce e PSA restricted
        source: cluster
        check: admission-enforced
      - id: PLT-04
        title: NetworkPolicy de egresso (anti-SSRF) nos ambientes de produção
        source: chart
        check: egress-policy-prod
      - id: PLT-13
        title: Gate SAST
        source: sast-summary
        check: sast-pass
      - id: PLT-22
        title: Workflows e actions da plataforma pinados no SHA de uma tag de release (vX.Y.Z)
        source: repo
        check: platform-pins-released
  - id: 3
    name: Regulated
    # L3 fecha tudo que o processo controla em 10; fora da régua ficam só colaboração/atividade: Contributors
    # (organizações distintas), CII-Best-Practices (coberto por BP-18/BP-26), Maintained/Packaging/CI-Tests
    # (atividade ou -1 quando não se aplicam). Fuzzing conta: o Scorecard reconhece testes baseados em propriedades
    # com FsCheck em C#/F# e fast-check em JavaScript/TypeScript (além de ClusterFuzzLite e OSS-Fuzz). Branch-Protection 9+ exige 2 aprovações e 10
    # dispensar bypass, o que pede um 2º mantenedor. Com estes mínimos a nota agregada fica em ≥ 9.5.
    scorecard:
      minScore: 9
      checks:
        Dangerous-Workflow: 10
        Token-Permissions: 10
        Binary-Artifacts: 10
        Vulnerabilities: 10
        Dependency-Update-Tool: 10
        Security-Policy: 10
        License: 10
        SAST: 10
        Pinned-Dependencies: 10
        Code-Review: 10
        Signed-Releases: 10
        Fuzzing: 10
        Branch-Protection: 8
    bestPractices: gold
    coverage:
      minLine: 85
      minBranch: 70
      noRegression: true
    controls:
      - id: PLT-14
        title: Gate DAST na superfície exposta
        source: dast-summary
        check: dast-pass
      - id: PLT-19
        title: Attestation (SBOM/proveniência) verificada no admission
        source: cluster
        check: attestation-enforced
      - id: PLT-10
        title: Produção só por PR com revisão (CODEOWNERS + ruleset)
        source: repo
        check: prod-by-pr
      - id: PLT-16
        title: Relatório de drift em produção
        source: drift-summary
        check: drift-report
      - id: PLT-20
        title: WAF declarado em toda API ou site exposto em produção (chart ou módulo infra/cloudflare)
        source: chart + infra/cloudflare
        check: waf-declared-prod
      - id: PLT-21
        title: Evidências retidas (sumários versionados)
        source: repo
        check: evidence-retained
