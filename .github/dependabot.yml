version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: nuget
    directory: /cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: docker
    directory: /examples/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: npm
    directories: [/examples/site-static, /examples/site-ssr]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
