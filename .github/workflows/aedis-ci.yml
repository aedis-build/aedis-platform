# Pipeline único de qualidade de um repositório Aedis (.NET ou Node): Conventional Commits, testes com cobertura e
# Os reutilizáveis irmãos são chamados por caminho relativo: o GitHub os resolve no mesmo commit deste workflow, então
# um caller pinado em vX.Y.Z roda todos na vX.Y.Z (um pin literal apontaria para outra versão da plataforma).
# gate, Codecov opcional, SAST (Semgrep + regras Aedis), CodeQL, SCA (action Aedis SCA, aedis-build/aedis-sca: Trivy
# sobre dependências, segredos e misconfiguração), REUSE e DAST opcional contra a app servida (action Aedis DAST,
# aedis-build/aedis-dast). O
# repositório tem um único caller (.github/workflows/aedis-ci.yml) que chama este workflow pinado por SHA; o conteúdo
# do pipeline é da plataforma, e o repositório não tira etapas sem mudar o pin (que passa por revisão humana).
# Ficam fora, por restrição do GitHub ou de segurança: o portão de merge (workflow_run, sempre da versão de main),
# o Scorecard (só publica num workflow com o job dele) e a release/imagem (outro gatilho e permissões de escrita).
#
# Permissões que o caller concede ao job que chama este workflow (o GitHub valida na largada, mesmo para jobs
# pulados): contents: read, actions: read, packages: read, security-events: write, id-token: write.
name: aedis-ci

on:
  workflow_call:
    inputs:
      language:
        description: dotnet | node. Decide o workflow de cobertura, a linguagem do CodeQL e o setup do DAST.
        type: string
        default: dotnet
      solution:
        description: Solução ou projeto de testes (dotnet)
        type: string
        default: ""
      dotnet-version:
        type: string
        default: 10.0.x
      test-env:
        description: Variáveis de ambiente do dotnet test, uma por linha (KEY=VALUE), ex. para ligar suítes de integração opt-in (dotnet)
        type: string
        default: ""
      min-line:
        type: number
        default: 60
      min-branch:
        type: number
        default: 0
      coverage-script:
        description: Script pnpm que roda os testes com cobertura (node)
        type: string
        default: test:coverage
      coverage-reports:
        description: Glob dos relatórios Cobertura gerados pelo script (node)
        type: string
        default: coverage/cobertura-coverage.xml
      no-regression:
        description: Falha se a cobertura de linhas cair em relação ao último run verde do branch base (L2+)
        type: boolean
        default: false
      codecov:
        description: Envia o Cobertura ao Codecov por OIDC (exige a GitHub App do Codecov na organização)
        type: boolean
        default: false
      reuse:
        description: Roda o REUSE lint (licença e copyright em todo arquivo)
        type: boolean
        default: true
      dast-start:
        description: Comando que constrói e serve a app em http://localhost:8080 (ex. "pnpm build && pnpm start &"). Vazio = sem DAST.
        type: string
        default: ""
      dast-fail-on:
        description: Risco mínimo que reprova o DAST (High ou Medium)
        type: string
        default: High
      check-scripts:
        description: Scripts pnpm rodados em sequência no job check, separados por espaço (ex. "typecheck build"). Vazio = sem o job (node)
        type: string
        default: ""
      codeql-queries:
        description: Suíte extra do CodeQL (ex. security-extended). Vazio = a padrão
        type: string
        default: ""
      sast-extra-configs:
        description: Rulesets Semgrep somados aos da linguagem (ex. "p/nextjs")
        type: string
        default: ""
      platform-ref:
        type: string
        default: ""

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/conventional-commits.yml
    permissions:
      contents: read
    with:
      # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
      platform-ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}

  coverage:
    if: inputs.language == 'dotnet' && github.event_name != 'schedule'
    uses: ./.github/workflows/coverage.yml
    permissions:
      contents: read
      packages: read
    with:
      solution: ${{ inputs.solution }}
      dotnet-version: ${{ inputs.dotnet-version }}
      min-line: ${{ inputs.min-line }}
      min-branch: ${{ inputs.min-branch }}
      no-regression: ${{ inputs.no-regression }}
      test-env: ${{ inputs.test-env }}
      # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
      platform-ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}

  coverage-js:
    if: inputs.language == 'node' && github.event_name != 'schedule'
    uses: ./.github/workflows/coverage-js.yml
    permissions:
      contents: read
      actions: read
    with:
      script: ${{ inputs.coverage-script }}
      reports: ${{ inputs.coverage-reports }}
      min-line: ${{ inputs.min-line }}
      min-branch: ${{ inputs.min-branch }}
      no-regression: ${{ inputs.no-regression }}
      # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
      platform-ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}

  # Verificações do repositório que não são teste nem cobertura (typecheck, build estático), em ordem.
  check:
    name: Check
    if: inputs.language == 'node' && inputs.check-scripts != '' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scripts
        env:
          SCRIPTS: ${{ inputs.check-scripts }}
        run: |
          set -euo pipefail
          for script in $SCRIPTS; do
            echo "::group::pnpm run $script"
            pnpm run "$script"
            echo "::endgroup::"
          done

  # Cobertura mesclada do mesmo run (artefato coverage-summary) enviada por OIDC, sem token.
  codecov:
    name: Codecov
    if: ${{ !cancelled() && inputs.codecov && (needs.coverage.result == 'success' || needs.coverage-js.result == 'success') }}
    needs: [coverage, coverage-js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout só para o uploader enviar a lista de arquivos do repositório: sem ela o Codecov não casa os caminhos
      # absolutos do runner no Cobertura com o repositório e descarta o relatório (estado error, 0 arquivos).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
          path: coverage-summary
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ inputs.language == 'node' && format('coverage-summary/{0}', inputs.coverage-reports) || 'coverage-summary/coverage/Cobertura.xml' }}
          fail_ci_if_error: true

  sast:
    uses: ./.github/workflows/sast.yml
    permissions:
      contents: read
      security-events: write
    with:
      # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
      platform-ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}
      extra-configs: ${{ format('{0} {1}', inputs.language == 'node' && 'p/javascript p/typescript p/react' || '', inputs.sast-extra-configs) }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.language == 'dotnet'
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.language == 'node' && 'javascript-typescript' || 'csharp' }}
          build-mode: ${{ inputs.language == 'node' && 'none' || 'autobuild' }}
          queries: ${{ inputs.codeql-queries }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  reuse:
    name: REUSE
    if: inputs.reuse && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint

  # SCA (Trivy fs: vulnerabilidades das dependências nos lockfiles, segredos e misconfiguração em Dockerfile, manifestos
  # e IaC) pela action Aedis SCA; aceites em deps-accept.yaml do repositório, SARIF no code scanning. O artefato é
  # sca-summary porque o coverage.yml já publica deps-summary (dotnet list package / pnpm audit, mesmo script).
  sca:
    name: SCA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aedis-build/aedis-sca@516872ee6ede29d8dc92d932175700c1958693c3 # repin to v1.0.0 once released
        with:
          summary-name: sca-summary

  # DAST (ZAP baseline) contra a app servida pelo comando dast-start; aceites em dast-accept.yaml do repositório.
  dast:
    if: inputs.dast-start != '' && github.event_name != 'schedule'
    name: DAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.language == 'dotnet'
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.language == 'node'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.language == 'node'
        with:
          node-version: "22"
          cache: pnpm
      - if: inputs.language == 'node'
        run: pnpm install --frozen-lockfile
      - name: Subir a app
        env:
          DAST_START: ${{ inputs.dast-start }}
        run: |
          set -euo pipefail
          bash -c "$DAST_START"
          curl --retry 30 --retry-connrefused --retry-delay 2 -fsS -o /dev/null http://localhost:8080/
      - uses: aedis-build/aedis-dast@79009359fe7e0b4400c35c92c83c72d4f107fd01 # repin to v1.0.0 once released
        with:
          target-url: http://localhost:8080/
          fail-on: ${{ inputs.dast-fail-on }}
