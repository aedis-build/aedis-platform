# Publica o chart aedis-app como OCI em ghcr.io/aedis-build/charts e assina com cosign (keyless, OIDC do GitHub).
# Dispara em tag chart-aedis-app-vX.Y.Z (a versão da tag deve ser a de Chart.yaml).
name: release-chart

on:
  push:
    tags: ["chart-aedis-app-v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar helm, helm-unittest e cosign
        run: |
          set -euo pipefail
          HELM_VERSION=v3.18.4
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Versão da tag == Chart.yaml
        id: ver
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#chart-aedis-app-v}"
          chart_ver="$(sed -n 's/^version: *//p' charts/aedis-app/Chart.yaml)"
          [ "$tag_ver" = "$chart_ver" ] || { echo "tag $tag_ver != Chart.yaml $chart_ver"; exit 1; }
          echo "version=$chart_ver" >> "$GITHUB_OUTPUT"

      - name: Testes do chart
        run: |
          set -euo pipefail
          for f in charts/aedis-app/ci/*.yaml; do helm lint charts/aedis-app -f "$f"; done
          helm unittest charts/aedis-app

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package + push OCI
        id: push
        run: |
          set -euo pipefail
          helm package charts/aedis-app -d dist
          out="$(helm push dist/aedis-app-${{ steps.ver.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)"
          echo "$out"
          digest="$(echo "$out" | sed -n 's/^Digest: *//p')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Assinar o chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "ghcr.io/${{ github.repository_owner }}/charts/aedis-app@${{ steps.push.outputs.digest }}"
