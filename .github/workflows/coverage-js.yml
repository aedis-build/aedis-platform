# Workflow reutilizável: testes JavaScript/TypeScript com cobertura (vitest/jest com reporter Cobertura) e o mesmo
# gate de limiar/regressão do coverage.yml (.NET). O repositório só precisa de um script pnpm que escreva o XML
# Cobertura; o scripts/coverage-gate.py do aedis-platform lê o XML e produz coverage-summary.json
# (aedis.platform/coverage-summary/v1), publicado com o XML como artefato coverage-summary.
name: coverage-js

on:
  workflow_call:
    inputs:
      script:
        description: Script pnpm que roda os testes com cobertura (reporter cobertura ligado)
        type: string
        default: test:coverage
      reports:
        description: Glob dos relatórios Cobertura gerados pelo script
        type: string
        default: coverage/cobertura-coverage.xml
      node-version:
        type: string
        default: "22"
      min-line:
        description: Cobertura mínima de linhas (%)
        type: number
        default: 60
      min-branch:
        description: Cobertura mínima de branches (%)
        type: number
        default: 0
      no-regression:
        description: Falha se a cobertura de linhas cair mais de 1 ponto em relação ao último run verde do branch base (L2+)
        type: boolean
        default: false
      platform-ref:
        type: string
        default: v1
    outputs:
      result:
        value: ${{ jobs.test.outputs.result }}

permissions: {}

jobs:
  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Baixar o artefato do último run verde do branch base (no-regression).
      actions: read
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts do aedis-platform
        if: github.repository != 'aedis-build/aedis-platform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aedis-build/aedis-platform
          ref: ${{ inputs.platform-ref }}
          path: .aedis-platform
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Testes com cobertura
        env:
          SCRIPT: ${{ inputs.script }}
        run: pnpm run "$SCRIPT"

      - name: Baseline do branch principal (sumário anterior)
        if: github.event_name == 'pull_request' && inputs.no-regression
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF" --workflow "$WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-summary -D baseline || echo "sem baseline"

      - name: Gate
        id: gate
        env:
          REPORTS: ${{ inputs.reports }}
          MIN_LINE: ${{ inputs.min-line }}
          MIN_BRANCH: ${{ inputs.min-branch }}
        run: |
          set -euo pipefail
          script=scripts/coverage-gate.py; [ -f "$script" ] || script=.aedis-platform/scripts/coverage-gate.py
          baseline=""; [ -f baseline/coverage-summary.json ] && baseline="--baseline baseline/coverage-summary.json"
          if python3 "$script" --reports "$REPORTS" --min-line "$MIN_LINE" --min-branch "$MIN_BRANCH" $baseline --out coverage-summary.json; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage-summary.json
            ${{ inputs.reports }}
          if-no-files-found: ignore
