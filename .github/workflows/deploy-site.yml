# Deploy de um site, estático ou com servidor (SSR), num provedor de borda, chamado pelo repositório do site. Um só
# reutilizável para os dois tipos: o que muda entre eles é o build e o modo da action do provedor.
#
#   type: static  export estático (Next `output: "export"` ou qualquer gerador): `pnpm run <build-script>`, pacote de
#                 <out-dir>; publicado com `wrangler deploy` (só assets).
#   type: ssr     Next com servidor via OpenNext (`opennextjs-cloudflare build` → `.open-next/` + configuração do
#                 Wrangler); publicado como versão: `wrangler versions upload` + `versions deploy`, com percentual,
#                 preview por PR e rollback.
#
# O build roda aqui, num job deste reutilizável isolado do repositório que chama, então a atestação (proveniência de
# build do GitHub) atende SLSA Build L3. O job de deploy baixa o pacote, verifica a atestação exigindo que ela tenha
# saído deste workflow e publica exatamente aqueles bytes pela action do provedor, pinada por SHA
# (aedis-build/aedis-deploy-cloudflare): verificação do token, lint do wrangler.jsonc, orçamento do bundle, segredos
# de runtime por stdin. Depois, o smoke test (action aedis-dast no modo edge + 200 em `/` e no health path); com
# `percentage` < 100 e smoke falho, a versão anterior volta a 100 %. Qualquer pessoa confere o que está no ar:
#   gh attestation verify <name>.tgz -R <org>/<repo> --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-site.yml
#
# Modos, decididos pelo evento:
#   push / workflow_dispatch      deploy no `environment` (padrão prd).
#   workflow_dispatch + rollback-version-id   rollback: só para uma versão cujo pacote (do run que a publicou) tem
#                                 atestação válida deste workflow.
#   pull_request com preview: true (só type ssr, nunca de fork)   versão com alias pr-<n> no environment `preview`
#                                 (Worker separado, env.preview do wrangler.jsonc), URL comentada na PR.
#   pull_request sem preview      só build, atestação e verificação: nada é publicado.
#   pull_request de fork          nada roda (sem id-token nem segredos).
#
# Segredos: declarados aqui, nunca `secrets: inherit`. Ficam no environment do GitHub (prd, staging, preview); como o
# job de deploy declara o environment, o segredo do environment prevalece sobre o que o caller repassa. Sem
# CLOUDFLARE_API_TOKEN o job de deploy verifica a atestação, avisa e não publica (dry-run). A Cloudflare não aceita
# OIDC do GitHub: o token expira e é rotacionado (a action avisa 14 dias antes).
#
# Permissões que o caller concede: contents: read, id-token: write, attestations: write, pull-requests: write (o
# comentário do preview), actions: read (o rollback baixa o pacote do run original). O GitHub valida as permissões de
# todos os jobs, inclusive os que não rodam naquele evento.
#
# Kubernetes não passa por aqui: um site no cluster é `type: site` do chart aedis-app (GitOps).
name: deploy-site

on:
  workflow_call:
    inputs:
      type:
        description: "static (export estático) ou ssr (Next com servidor, OpenNext)"
        type: string
        required: true
      provider:
        description: Provedor de borda (por ora só cloudflare)
        type: string
        default: cloudflare
      name:
        description: Nome do pacote do site (vira <name>.tgz e <name>.sbom.spdx.json)
        type: string
        required: true
      working-directory:
        description: Pasta do site (num monorepo, a app); a instalação roda onde está o pnpm-lock.yaml (aqui ou na raiz)
        type: string
        default: "."
      build-script:
        description: "type static: script pnpm que gera o site, rodado em working-directory"
        type: string
        default: build
      build-command:
        description: "type ssr: comando do build, rodado em working-directory com os binários do pnpm no PATH"
        type: string
        default: opennextjs-cloudflare build
      out-dir:
        description: "type static: pasta do site gerado, relativa a working-directory"
        type: string
        default: out
      node-version:
        type: string
        default: "22"
      environment:
        description: Environment do GitHub com os segredos do deploy; vazio = sem environment (só dry-run de CI)
        type: string
        default: prd
      wrangler-env:
        description: Environment do Wrangler (env.<nome> do wrangler.jsonc); vazio = nível de cima
        type: string
        default: ""
      url:
        description: URL pública do site (smoke test e link do environment); vazio = o primeiro custom domain
        type: string
        default: ""
      health-path:
        description: Caminho que precisa responder 200 no smoke test, além de / (ex. /api/health)
        type: string
        default: ""
      secret-names:
        description: "type ssr: segredos de runtime do Worker (vírgula), lidos do segredo RUNTIME_SECRETS do environment"
        type: string
        default: ""
      percentage:
        description: "type ssr: fatia do tráfego da versão nova (1-100); abaixo de 100 a anterior fica com o resto"
        type: number
        default: 100
      preview:
        description: "Em pull_request, publica um preview pr-<n> (type ssr; nunca para forks)"
        type: boolean
        default: false
      smoke:
        description: Smoke test depois do deploy (aedis-dast no modo edge + 200 em / e no health-path)
        type: boolean
        default: true
      rollback-version-id:
        description: Rollback para esta versão (workflow_dispatch), depois de verificar a atestação do pacote dela
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      RUNTIME_SECRETS:
        description: JSON nome → valor dos segredos de runtime; só os nomes de secret-names são enviados ao Worker
        required: false
      SMOKE_HEADER:
        description: '"Nome: valor" que só o runner envia no smoke test (regra de skip do WAF para o desafio de bot)'
        required: false
    outputs:
      version-id:
        description: Versão publicada (ou do preview, ou do rollback)
        value: ${{ jobs.deploy.outputs.version-id || jobs.rollback.outputs.version-id }}
      url:
        description: URL pública
        value: ${{ jobs.deploy.outputs.url }}
      preview-url:
        description: URL do preview
        value: ${{ jobs.deploy.outputs.preview-url }}

permissions: {}

jobs:
  plan:
    name: Plano
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      environment: ${{ steps.plan.outputs.environment }}
      wrangler-env: ${{ steps.plan.outputs.wrangler-env }}
      alias: ${{ steps.plan.outputs.alias }}
    steps:
      - id: plan
        env:
          TYPE: ${{ inputs.type }}
          PROVIDER: ${{ inputs.provider }}
          PCT: ${{ inputs.percentage }}
          PREVIEW: ${{ inputs.preview }}
          ROLLBACK: ${{ inputs.rollback-version-id }}
          ENVIRONMENT: ${{ inputs.environment }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$TYPE" in static|ssr) ;; *) fail "type deve ser static ou ssr (recebido: $TYPE)" ;; esac
          [ "$PROVIDER" = cloudflare ] || fail "provider $PROVIDER não suportado: por ora só cloudflare (aedis-build/aedis-deploy-cloudflare)"
          [[ "$PCT" =~ ^[0-9]+$ ]] && [ "$PCT" -ge 1 ] && [ "$PCT" -le 100 ] || fail "percentage deve ser um inteiro de 1 a 100"
          [ "$TYPE" = ssr ] || [ "$PCT" = 100 ] || fail "percentage só vale para type ssr: um site estático não tem versões para dividir tráfego"
          mode=deploy; environment="$ENVIRONMENT"; wenv="$WRANGLER_ENV"; alias=""
          if [ -n "$ROLLBACK" ]; then
            [ "$EVENT" = workflow_dispatch ] || fail "rollback-version-id só em workflow_dispatch"
            mode=rollback
          elif [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            [ "$EVENT" = pull_request ] || fail "deploy-site não roda em pull_request_target: o código da PR não pode ver segredos"
            mode=build; environment=""; wenv=""
            if [ "$HEAD_REPO" != "$REPO" ]; then
              # Sem id-token nem segredos numa PR de fork: nada a atestar nem a publicar.
              mode=skip
              echo "::notice::PR de fork ($HEAD_REPO): deploy-site não roda; nenhum segredo chega ao código de fora"
            elif [ "$PREVIEW" = true ]; then
              if [ "$TYPE" = static ]; then
                echo "::notice::preview só para type ssr; aqui só build, atestação e verificação"
              else
                mode=preview; environment=preview; wenv=preview; alias="pr-$PR"
              fi
            fi
          fi
          { echo "mode=$mode"; echo "environment=$environment"; echo "wrangler-env=$wenv"; echo "alias=$alias"; } >> "$GITHUB_OUTPUT"
          echo "modo $mode, environment '${environment}', wrangler env '${wenv}'${alias:+, alias $alias}"

  build:
    name: Build, SBOM e atestação
    needs: plan
    if: needs.plan.outputs.mode != 'rollback' && needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Onde instalar
        id: install
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          [ -d "$WD" ] || { echo "::error::working-directory $WD não existe"; exit 1; }
          # Um site com lockfile próprio instala na sua pasta; num monorepo, o lockfile é o da raiz.
          if [ -f "$WD/pnpm-lock.yaml" ]; then echo "dir=$WD" >> "$GITHUB_OUTPUT"; else echo "dir=." >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ steps.install.outputs.dir }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ steps.install.outputs.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.install.outputs.dir }}
      - name: Build e pacote (static)
        if: inputs.type == 'static'
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPT: ${{ inputs.build-script }}
          OUT: ${{ inputs.out-dir }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          pnpm run "$SCRIPT"
          [ -d "$OUT" ] || { echo "::error::o build não gerou $OUT (out-dir, relativo a working-directory)"; exit 1; }
          tar -czf "$GITHUB_WORKSPACE/$NAME.tgz" -C "$OUT" .
      # OpenNext não suporta build no Windows; este job é Linux. O pacote leva o bundle e a configuração do Wrangler
      # que o descreve, então o deploy publica exatamente o que foi atestado.
      - name: Build e pacote (ssr)
        if: inputs.type == 'ssr'
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          NAME: ${{ inputs.name }}
          NEXT_TELEMETRY_DISABLED: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          pnpm exec bash -c "$BUILD_COMMAND"
          cfg=""; for f in wrangler.json wrangler.jsonc wrangler.toml; do [ -f "$f" ] && { cfg="$f"; break; }; done
          [ -n "$cfg" ] || { echo "::error::sem wrangler.json, wrangler.jsonc ou wrangler.toml em working-directory"; exit 1; }
          [ -d .open-next ] || { echo "::error::o build não gerou .open-next/ (build-command: $BUILD_COMMAND)"; exit 1; }
          tar -czf "$GITHUB_WORKSPACE/$NAME.tgz" .open-next "$cfg"
      - name: SBOM (syft, SPDX) das dependências que construíram o site
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ steps.install.outputs.dir }}
          format: spdx-json
          output-file: ${{ inputs.name }}.sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.name }}.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}
          path: |
            ${{ inputs.name }}.tgz
            ${{ inputs.name }}.sbom.spdx.json

  deploy:
    name: Verificar e publicar
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.publish.outputs.preview-url || inputs.url || steps.publish.outputs.url }}
    concurrency:
      group: deploy-site-${{ github.repository }}-${{ inputs.name }}-${{ needs.plan.outputs.environment }}-${{ needs.plan.outputs.alias }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      version-id: ${{ steps.publish.outputs.version-id }}
      url: ${{ steps.publish.outputs.url }}
      preview-url: ${{ steps.publish.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Onde instalar
        id: install
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          if [ -f "$WD/pnpm-lock.yaml" ]; then echo "dir=$WD" >> "$GITHUB_OUTPUT"; else echo "dir=." >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ steps.install.outputs.dir }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ steps.install.outputs.dir }}/pnpm-lock.yaml
      # Só para o wrangler (pinado pelo lockfile do site); o site vem do pacote atestado, não deste checkout.
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.install.outputs.dir }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}
      - name: Verificar a atestação e desempacotar exatamente aqueles bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ inputs.name }}
          TYPE: ${{ inputs.type }}
          WD: ${{ inputs.working-directory }}
          OUT: ${{ inputs.out-dir }}
        run: |
          set -euo pipefail
          gh attestation verify "$NAME.tgz" -R "$REPO" \
            --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-site.yml
          if [ "$TYPE" = static ]; then
            rm -rf "${WD:?}/$OUT" && mkdir -p "$WD/$OUT" && tar -xzf "$NAME.tgz" -C "$WD/$OUT"
          else
            rm -rf "${WD:?}/.open-next" && tar -xzf "$NAME.tgz" -C "$WD"
          fi
      - name: Credenciais
        id: creds
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$MODE" = build ]; then
            echo "pull_request sem preview: pacote construído, atestado e verificado; nada é publicado" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != true ]; then
            echo "::warning::sem CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no environment '${ENVIRONMENT}': atestação verificada, deploy pulado (dry-run)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar
        id: publish
        if: steps.creds.outputs.publish == 'true'
        uses: aedis-build/aedis-deploy-cloudflare@0addaaeae0d3d5ada73262b740b39f212d4b8e28 # repin to v1.0.0 once released
        with:
          mode: ${{ inputs.type == 'ssr' && 'worker' || 'static' }}
          artifact-dir: ${{ inputs.working-directory }}
          environment-name: ${{ needs.plan.outputs.wrangler-env }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secret-names: ${{ inputs.secret-names }}
          secrets-json: ${{ secrets.RUNTIME_SECRETS || '{}' }}
          percentage: ${{ needs.plan.outputs.mode == 'preview' && 100 || inputs.percentage }}
          preview-alias: ${{ needs.plan.outputs.alias }}
      # A URL do site a partir do runner: 200 em / e no health path, CSP com nonce ou hashes, HSTS e nosniff. O
      # cabeçalho SMOKE_HEADER (regra de skip do WAF) vai ao curl por um config no stdin, nunca como argumento.
      - name: Smoke test (status e cabeçalhos)
        id: smoke-http
        if: steps.publish.outcome == 'success' && needs.plan.outputs.mode == 'deploy' && inputs.smoke
        env:
          URL: ${{ inputs.url || steps.publish.outputs.url }}
          HEALTH: ${{ inputs.health-path }}
          SMOKE_HEADER: ${{ secrets.SMOKE_HEADER }}
        run: |
          set -uo pipefail
          [ -n "$URL" ] || { echo "::error::sem url para o smoke test: passe url ou declare um custom domain"; exit 1; }
          base="${URL%/}"; errors=0
          get() { { echo 'silent'; echo 'show-error'; echo 'location'; echo 'max-time = 30'; [ -z "$SMOKE_HEADER" ] || printf 'header = "%s"\n' "$SMOKE_HEADER"; } \
                    | curl -K - -o /dev/null -D "$2" -w '%{http_code}' "$1" 2>/dev/null || true; }
          err() { echo "::error::$1"; errors=$((errors + 1)); }
          for path in / ${HEALTH:+"$HEALTH"}; do
            code="$(get "$base$path" "$RUNNER_TEMP/smoke.headers")"
            echo "GET $base$path -> $code"
            [ "$code" = 200 ] || err "GET $base$path respondeu $code, esperado 200"
          done
          get "$base/" "$RUNNER_TEMP/smoke.headers" > /dev/null
          h="$(tr -d '\r' < "$RUNNER_TEMP/smoke.headers" | tr '[:upper:]' '[:lower:]')"
          csp="$(grep '^content-security-policy:' <<< "$h" | tail -1)"
          [ -n "$csp" ] || err "sem Content-Security-Policy em $base/"
          [ -z "$csp" ] || grep -qE "'(nonce-|sha(256|384|512)-)" <<< "$csp" || err "a CSP de $base/ não usa nonce nem hashes"
          grep -q '^strict-transport-security:' <<< "$h" || err "sem Strict-Transport-Security em $base/"
          grep -qE '^x-content-type-options: *nosniff' <<< "$h" || err "sem X-Content-Type-Options: nosniff em $base/"
          exit $((errors > 0))
      - name: Smoke test (aedis-dast, modo edge)
        id: smoke-dast
        if: steps.publish.outcome == 'success' && needs.plan.outputs.mode == 'deploy' && inputs.smoke
        uses: aedis-build/aedis-dast@6ffb63fef3b947247be38d2cb2ae4b46033bd1fd # v1.0.2
        env:
          SMOKE_HEADER: ${{ secrets.SMOKE_HEADER }}
        with:
          target-url: ${{ inputs.url || steps.publish.outputs.url }}
          target-paths: ${{ inputs.health-path }}
          edge: true
          # O ZAP passa pelo desafio de bot com o mesmo cabeçalho do WAF (modo session, cabeçalho lido do ambiente,
          # nunca do texto do input); o check de borda da action ainda não envia cabeçalhos próprios.
          auth: ${{ secrets.SMOKE_HEADER != '' && 'session' || 'none' }}
          login-command: >-
            python3 -c 'import json,os; n,v=os.environ["SMOKE_HEADER"].split(":",1); print(json.dumps({"headers":{n.strip():v.strip()}}))'
          summary-name: smoke-dast-summary-${{ inputs.name }}
          report-name: smoke-dast-report-${{ inputs.name }}
      - name: Smoke falhou com rollout parcial, a versão anterior volta a 100 %
        if: >-
          failure() && steps.publish.outcome == 'success' && steps.publish.outputs.previous-version-id != ''
          && inputs.percentage < 100 && (steps.smoke-http.outcome == 'failure' || steps.smoke-dast.outcome == 'failure')
        uses: aedis-build/aedis-deploy-cloudflare@0addaaeae0d3d5ada73262b740b39f212d4b8e28 # repin to v1.0.0 once released
        with:
          mode: worker
          artifact-dir: ${{ inputs.working-directory }}
          environment-name: ${{ needs.plan.outputs.wrangler-env }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          rollback-to: ${{ steps.publish.outputs.previous-version-id }}

  preview-comment:
    name: URL do preview na PR
    needs: [plan, deploy]
    if: needs.plan.outputs.mode == 'preview' && needs.deploy.outputs.preview-url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NAME: ${{ inputs.name }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
          VERSION: ${{ needs.deploy.outputs.version-id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker="<!-- aedis-deploy-site:preview:$NAME -->"
          body="$marker"$'\n'"**Preview \`$NAME\`**: $PREVIEW_URL"$'\n\n'"Versão \`$VERSION\` do commit ${SHA::12}, construída e atestada pelo deploy-site da Aedis Platform. Atualizado a cada push."
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # Rollback por workflow_dispatch: a versão só volta ao ar se o pacote que a gerou (o artefato do run cujo id está
  # na mensagem da versão) tem atestação válida deste workflow. Dentro da retenção de artefatos do repositório.
  rollback:
    name: Rollback para uma versão atestada
    needs: plan
    if: needs.plan.outputs.mode == 'rollback'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    concurrency:
      group: deploy-site-${{ github.repository }}-${{ inputs.name }}-${{ inputs.environment }}-
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      version-id: ${{ steps.rollback.outputs.version-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Onde instalar
        id: install
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          if [ -f "$WD/pnpm-lock.yaml" ]; then echo "dir=$WD" >> "$GITHUB_OUTPUT"; else echo "dir=." >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ steps.install.outputs.dir }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ steps.install.outputs.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ steps.install.outputs.dir }}
      - name: Run que publicou a versão
        id: origin
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ inputs.rollback-version-id }}
          WENV: ${{ inputs.wrangler-env }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::rollback-version-id não é um id de versão"; exit 1; }
          env_args=(); [ -z "$WENV" ] || env_args=(--env "$WENV")
          pnpm exec wrangler versions view "$VERSION" --json "${env_args[@]}" > "$RUNNER_TEMP/version.json"
          run="$(python3 -c 'import json,re,sys; t=open(sys.argv[1]).read(); v=json.loads(t[t.find("{"):]); m=re.search(r"\brun (\d+)\b", (v.get("annotations") or {}).get("workers/message") or ""); print(m.group(1) if m else "")' "$RUNNER_TEMP/version.json")"
          [ -n "$run" ] || { echo "::error::a versão $VERSION não foi publicada pelo deploy-site (a mensagem não cita o run): rollback recusado"; exit 1; }
          echo "run-id=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}
          run-id: ${{ steps.origin.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verificar a atestação do pacote daquela versão
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ inputs.name }}
        run: |
          gh attestation verify "$NAME.tgz" -R "$REPO" \
            --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-site.yml
      - name: Rollback
        id: rollback
        uses: aedis-build/aedis-deploy-cloudflare@0addaaeae0d3d5ada73262b740b39f212d4b8e28 # repin to v1.0.0 once released
        with:
          mode: ${{ inputs.type == 'ssr' && 'worker' || 'static' }}
          artifact-dir: ${{ inputs.working-directory }}
          environment-name: ${{ inputs.wrangler-env }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          rollback-to: ${{ inputs.rollback-version-id }}
