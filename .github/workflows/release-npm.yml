# Publicação de um pacote npm com proveniência, chamada pelo repositório do pacote em tag <tag-prefix>vX.Y.Z. Confere a
# tag contra a version do package.json do pacote, roda os scripts de verificação e o build no diretório dele, gera o
# SBOM e publica com `npm publish --provenance` por Trusted Publishing (OIDC): nenhum NPM_TOKEN existe no repositório
# nem na organização, e o npm registra a proveniência (repositório, workflow e commit). O npm é pinado como toda
# ferramenta daqui.
#
# Trusted Publishing no npmjs.com (uma vez, por pacote): registre o repositório chamador, o NOME DO ARQUIVO DO
# WORKFLOW CHAMADOR (o npm valida o workflow que iniciou a execução, `workflow_ref`, não este reutilizável) e o
# environment usado aqui. Confirme na primeira publicação: a página do pacote deve mostrar a proveniência apontando
# para o repositório e o commit da tag. Nas configurações do pacote, exija 2FA e não permita tokens.
#
# Permissões que o caller concede: contents: read, id-token: write.
name: release-npm

on:
  workflow_call:
    inputs:
      package-dir:
        description: Diretório do pacote (com o package.json publicado)
        type: string
        required: true
      tag-prefix:
        description: Prefixo da tag antes do v (ex. cli- para cli-v1.2.3); vazio para vX.Y.Z
        type: string
        default: ""
      check-scripts:
        description: Scripts pnpm rodados em sequência no diretório do pacote antes do build, separados por espaço
        type: string
        default: typecheck test:coverage
      build-script:
        description: Script pnpm que gera o que o campo files do package.json publica
        type: string
        default: build
      node-version:
        type: string
        default: "22"
      npm-version:
        description: Versão do npm usada para publicar (Trusted Publishing exige um npm recente)
        type: string
        default: 12.2.0
      environment:
        description: Environment do repositório chamador registrado no Trusted Publishing do npm
        type: string
        default: npm

permissions: {}

jobs:
  publish:
    name: Verificar, construir e publicar no npm
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      DIR: ${{ inputs.package-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A tag é a versão do pacote
        env:
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./$DIR/package.json').version")"
          test "${PREFIX}v$version" = "$TAG" || { echo "::error::a tag $TAG não é a versão $version de $DIR/package.json"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Scripts de verificação
        env:
          SCRIPTS: ${{ inputs.check-scripts }}
        run: |
          set -euo pipefail
          for script in $SCRIPTS; do
            echo "::group::pnpm -C $DIR run $script"
            pnpm -C "$DIR" run "$script"
            echo "::endgroup::"
          done
      - name: Build
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: pnpm -C "$DIR" run "$SCRIPT"
      - name: SBOM (syft, SPDX) do pacote
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ inputs.package-dir }}
          format: spdx-json
          artifact-name: npm-sbom.spdx.json
      - name: Publicar com proveniência (Trusted Publishing, OIDC)
        env:
          NPM: ${{ inputs.npm-version }}
        run: npx --yes "npm@$NPM" publish --provenance --access public
        working-directory: ${{ inputs.package-dir }}
