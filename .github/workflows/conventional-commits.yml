# Exige Conventional Commits em todos os commits da PR e no título da PR (que vira a mensagem do squash).
# Reutilizável: o repo GitOps do tenant e os repos de app chamam com `uses:`. É a base do versionamento
# semântico automatizado (release notes e bump de versão derivam dos tipos feat/fix/!). A regra vive numa fonte só,
# scripts/check-conventional-commits.sh da action Aedis Release Cut (aedis-build/aedis-release-cut), a mesma que
# decide o que a release-cut libera.
name: conventional-commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    inputs:
      platform-ref:
        description: "Ignorado: o script vem do aedis-release-cut. Removido em v2"
        type: string
        default: ""

permissions: {}

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Script de verificação (aedis-release-cut)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aedis-build/aedis-release-cut
          ref: d88e10994c4639d14ffad8aa354476dc83a6fc32 # v1.0.2
          path: .aedis-release-cut
          persist-credentials: false

      - name: Commits da PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .aedis-release-cut/scripts/check-conventional-commits.sh --range "$BASE..$HEAD"

      - name: Título da PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash .aedis-release-cut/scripts/check-conventional-commits.sh --message "$TITLE"
