# Deploy de um site estático (Next.js `output: "export"` ou equivalente) na Cloudflare, chamado pelo repositório do
# site em push na main. O site é construído uma vez, empacotado, descrito por um SBOM e atestado (proveniência de
# build do GitHub). Como o build roda aqui, num workflow reutilizável da plataforma isolado do repositório que chama,
# a atestação atende SLSA Build L3. O job de deploy verifica a atestação, exigindo que ela tenha saído deste
# workflow, e publica exatamente aqueles bytes com o wrangler do lockfile do site. Qualquer pessoa confere o que está
# no ar:
#   gh attestation verify <name>.tgz -R <org>/<repo> --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-static.yml
#
# Segredos: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID ficam no environment do repositório que chama (padrão
# `prd`, protegido: só main e aprovador obrigatório). O caller precisa passar `secrets: inherit`: um reutilizável só
# recebe os segredos que o caller repassa, mesmo num job que declara o environment. A Cloudflare não aceita OIDC do
# GitHub; o token tem só Workers Editor e as rotas do domínio, e expira.
#
# Permissões que o caller concede: contents: read, id-token: write, attestations: write.
name: deploy-static

on:
  workflow_call:
    inputs:
      name:
        description: Nome do pacote do site (vira <name>.tgz e <name>.sbom.spdx.json)
        type: string
        required: true
      build-script:
        description: Script pnpm que gera o site estático
        type: string
        default: build
      out-dir:
        description: Pasta com o site gerado
        type: string
        default: out
      node-version:
        type: string
        default: "22"
      environment:
        description: Environment do repositório com os segredos da Cloudflare
        type: string
        default: prd
      url:
        description: URL pública mostrada no deploy
        type: string
        default: ""

permissions: {}

concurrency:
  group: deploy-static-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, SBOM e atestação
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: pnpm run "$SCRIPT"
      - name: Empacotar
        env:
          NAME: ${{ inputs.name }}
          OUT: ${{ inputs.out-dir }}
        run: tar -czf "$NAME.tgz" -C "$OUT" .
      - name: SBOM (syft, SPDX) das dependências que construíram o site
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ inputs.name }}.sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.name }}.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}
          path: |
            ${{ inputs.name }}.tgz
            ${{ inputs.name }}.sbom.spdx.json

  deploy:
    name: Verificar e publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      # Só para o wrangler (pinado pelo lockfile do site); o site vem do pacote atestado, não deste checkout.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}
      - name: Verificar a atestação e desempacotar exatamente aqueles bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ inputs.name }}
          OUT: ${{ inputs.out-dir }}
        run: |
          set -euo pipefail
          gh attestation verify "$NAME.tgz" -R "$REPO" \
            --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-static.yml
          rm -rf "$OUT" && mkdir -p "$OUT" && tar -xzf "$NAME.tgz" -C "$OUT"
      - name: Publicar
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
