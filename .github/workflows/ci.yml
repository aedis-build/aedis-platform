# CI deste repositório: chart (lint, unittest, render dos exemplos, kubeconform, Trivy config), scripts e
# o template do tenant validado com o próprio chart.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# Uma execução por pull request: um push novo ou fechar o PR cancela a que está rodando. Push na main
# nunca divide grupo (run_id), então essas execuções sempre terminam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  chart:
    if: github.event.action != 'closed'
    name: Chart aedis-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar helm, helm-unittest e kubeconform
        run: |
          set -euo pipefail
          HELM_VERSION=v3.18.4
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
          KUBECONFORM_VERSION=v0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: helm lint (cada values de exemplo)
        run: |
          set -euo pipefail
          for f in charts/aedis-app/ci/*.yaml; do helm lint charts/aedis-app -f "$f"; done

      - name: helm unittest
        run: helm unittest charts/aedis-app

      - name: Render dos exemplos + kubeconform
        run: |
          set -euo pipefail
          mkdir -p rendered
          for f in charts/aedis-app/ci/*.yaml; do
            n="$(basename "$f" .yaml)"
            helm template "$n" charts/aedis-app -f "$f" > "rendered/$n.yaml"
          done
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml

      - name: Trivy config
        run: |
          set -euo pipefail
          VER=0.76.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy
          trivy --version
          trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 rendered

      - name: Vazamento de fornecedor
        run: |
          set -euo pipefail
          pattern="$(printf '%s|%s' 'pay''hop' 'nuc''lea')"
          if grep -rniE "$pattern" --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj . ; then echo "referência a fornecedor encontrada"; exit 1; fi

  cluster-chart:
    if: github.event.action != 'closed'
    name: Chart aedis-cluster + políticas Kyverno
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar helm, kubeconform e kyverno
        run: |
          set -euo pipefail
          HELM_VERSION=v3.18.4
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"             | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
          KYVERNO_VERSION=v1.13.4
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin kyverno
      - name: lint + render + kubeconform
        run: |
          set -euo pipefail
          for f in charts/aedis-cluster/ci/*.yaml; do helm lint charts/aedis-cluster -f "$f"; done
          helm template c charts/aedis-cluster -f charts/aedis-cluster/ci/full-values.yaml > cluster.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 -skip ClusterSecretStore             -schema-location default             -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'             cluster.yaml
      - name: Políticas Kyverno (renders bons passam, pod ruim falha)
        run: bash scripts/test-kyverno-policies.sh

  cli:
    if: github.event.action != 'closed'
    name: CLI
    uses: ./.github/workflows/coverage.yml
    permissions:
      contents: read
      packages: read
    with:
      solution: cli/Aedis.Cli.slnx
      min-line: 60
      min-branch: 50

  semgrep-rules:
    if: github.event.action != 'closed'
    name: Regras Semgrep (semgrep --test)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.130.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd semgrep && semgrep --metrics=off --test --config rules tests

  sast:
    if: github.event.action != 'closed'
    name: SAST
    uses: ./.github/workflows/sast.yml
    permissions:
      contents: read
      security-events: write

  dast:
    if: github.event.action != 'closed'
    name: DAST (ZAP baseline na imagem de exemplo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Subir a app de exemplo
        run: |
          set -euo pipefail
          docker build -q -t example-app examples/app
          docker run -d --rm -p 8080:8080 --name example-app example-app
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/healthz
      - uses: ./.github/actions/dast
        with:
          target-url: http://localhost:8080/
          accept-file: examples/app/dast-accept.yaml
      - run: python3 .github/actions/dast/dast-summary.py --self-test

  reuse:
    if: github.event.action != 'closed'
    name: REUSE (licença e copyright em todo arquivo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint
      - run: python3 scripts/deps-summary.py --self-test
      - run: python3 scripts/release-notes.py --self-test
      - run: bash scripts/next-version.sh --self-test

  tenant-template:
    if: github.event.action != 'closed'
    name: Template do tenant valida com o chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar helm
        run: |
          set -euo pipefail
          HELM_VERSION=v3.18.4
          curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
      - name: Instanciar o template e validar
        run: |
          set -euo pipefail
          bash scripts/render-tenant-template.sh --cloud generic --org example --out /tmp/tenant
          cp -r examples/tenant/apps/* /tmp/tenant/apps/
          bash scripts/validate-apps.sh --chart "$PWD/charts/aedis-app" --repo /tmp/tenant --out /tmp/tenant-rendered
