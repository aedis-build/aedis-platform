# OpenSSF Scorecard: roda neste repo (semanal, push em main e manual) e como workflow reutilizável nos repos
# do tenant e das apps. Publica SARIF no code scanning e o sumário scorecard-summary.json.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Sumário (score total e por check)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, datetime
          sarif = json.load(open("scorecard.sarif", encoding="utf-8"))
          checks = {}
          for run in sarif.get("runs", []):
              for res in run.get("results", []):
                  rule = res.get("ruleId", "")
                  props = res.get("properties", {})
                  checks[rule] = props.get("score", props.get("risk"))
          json.dump({"schema": "aedis.platform/scorecard-summary/v1",
                     "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "repository": "${{ github.repository }}", "checks": checks},
                    open("scorecard-summary.json", "w", encoding="utf-8"), indent=2)
          EOF

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          sarif_file: scorecard.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-summary
          path: |
            scorecard-summary.json
            scorecard.sarif
