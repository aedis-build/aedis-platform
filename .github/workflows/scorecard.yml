# OpenSSF Scorecard: roda neste repo (semanal, push em main e manual) e, por workflow_call, nos repos do tenant e das
# apps (o caller concede contents: read, security-events: write, id-token: write). Publica SARIF no code scanning e o
# sumário scorecard-summary.json.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      publish-results:
        description: Publicar o resultado na API do Scorecard (badge e histórico públicos); exige repositório público
        type: boolean
        default: true

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results != false && github.event_name != 'pull_request' }}
          # A API recusa o que não vem de um workflow dentro das regras dela: melhor um run vermelho que um badge parado.
          fail_on_publish_error: ${{ inputs.publish-results != false && github.event_name != 'pull_request' }}


      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-summary
          path: scorecard.sarif
