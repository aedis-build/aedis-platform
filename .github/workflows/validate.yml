# Workflow reutilizável: valida um repo GitOps do Aedis Platform (apps/**, platform/values/**) com a action Aedis
# Conformance (aedis-build/aedis-conformance, no Marketplace: `aedis platform validate`, chart e CLI do mesmo commit
# da plataforma que este workflow) e passa o Trivy config nos manifestos renderizados.
# Uso no repo do tenant:
#   jobs:
#     validate:
#       uses: aedis-build/aedis-platform/.github/workflows/validate.yml@<sha da tag> # vX.Y.Z
name: validate

on:
  workflow_call:
    inputs:
      platform-ref:
        description: Ref do aedis-platform de onde vêm o chart e a CLI (tag, branch ou SHA); vazio usa o mesmo commit deste workflow
        type: string
        default: ""
      chart:
        description: Chart a usar. Vazio = charts/aedis-app do platform-ref; ou oci://ghcr.io/aedis-build/charts/aedis-app
        type: string
        default: ""
      chart-version:
        description: Versão do chart quando chart é um OCI ref
        type: string
        default: ""
      kubernetes-version:
        type: string
        default: "1.31.0"
      level:
        description: Nível de conformidade a checar (1, 2 ou 3) além da validação; vazio só valida
        type: string
        default: ""
      trivy-severity:
        type: string
        default: HIGH,CRITICAL
    outputs:
      result:
        value: ${{ jobs.apps.outputs.result }}

permissions: {}

jobs:
  apps:
    name: Chart + apps (helm, schema, kubeconform, Trivy config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.validate.outputs.result }}
    steps:
      - name: Checkout do repo GitOps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render + validação de todos os apps
        id: validate
        uses: aedis-build/aedis-conformance@db6e99416bb73a0743963be180fc3543096894b8 # v1.0.1
        with:
          # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
          platform-ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}
          chart: ${{ inputs.chart }}
          chart-version: ${{ inputs.chart-version }}
          kubernetes-version: ${{ inputs.kubernetes-version }}
          level: ${{ inputs.level }}
          out: rendered

      - name: Trivy config (misconfiguração nos manifestos renderizados)
        env:
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          set -euo pipefail
          VER=0.76.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy
          trivy --version
          trivy config --quiet --severity "$SEVERITY" --exit-code 1 rendered

      - name: Publicar sumário
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validate-summary
          path: rendered/validate-summary.json
          if-no-files-found: ignore
