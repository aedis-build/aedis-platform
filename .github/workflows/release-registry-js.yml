# Release de um registry shadcn (JSON em /r/<name>.json, como o do aedis-ui) com proveniência SLSA Build L3, chamado
# pelo repositório do registry em tag vX.Y.Z. O build roda AQUI, num workflow reutilizável da plataforma isolado do
# chamador: o chamador não altera o pacote entre o build e a atestação, e é isso que leva a atestação do GitHub do
# nível 2 ao 3. O job de publicação verifica a atestação, exigindo que ela tenha saído deste workflow, e anexa à
# GitHub Release o pacote, o bundle Sigstore (o @aedis/cli o lê e verifica antes de escrever qualquer arquivo) e o
# SBOM. Qualquer pessoa confere:
#   gh attestation verify <name>-<tag>.tgz -R <org>/<repo> --signer-workflow aedis-build/aedis-platform/.github/workflows/release-registry-js.yml
#
# A tag é conferida contra a versão declarada em version-file: uma tag errada não publica nada.
#
# Permissões que o caller concede: contents: write, id-token: write, attestations: write.
name: release-registry-js

on:
  workflow_call:
    inputs:
      name:
        description: Nome do pacote (vira <name>-<tag>.tgz, <name>-<tag>.tgz.sigstore e <name>-<tag>.sbom.spdx.json)
        type: string
        required: true
      registry-script:
        description: Script pnpm que gera o JSON do registry
        type: string
        default: registry:build
      registry-dir:
        description: Pasta gerada pelo script; seu nome é a pasta de topo do tgz (o @aedis/cli lê `r/`)
        type: string
        default: public/r
      version-file:
        description: package.json cuja `version` deve ser a da tag (sem o `v`)
        type: string
        default: package.json
      node-version:
        type: string
        default: "22"

permissions: {}

jobs:
  build:
    name: Build, SBOM e atestação
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A tag é a versão declarada
        env:
          FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./$FILE').version")"
          test "v$version" = "$TAG" || { echo "::error::a tag $TAG não é a versão $version declarada em $FILE"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build do registry
        env:
          SCRIPT: ${{ inputs.registry-script }}
        run: pnpm run "$SCRIPT"
      - name: Empacotar
        env:
          DIR: ${{ inputs.registry-dir }}
        run: tar -czf "$NAME-$TAG.tgz" -C "$(dirname "$DIR")" "$(basename "$DIR")"
      - name: SBOM (syft, SPDX) das dependências que construíram o registry
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ inputs.name }}-${{ github.ref_name }}.sbom.spdx.json
          upload-artifact: false
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.name }}-${{ github.ref_name }}.tgz
      # O nome que o @aedis/cli baixa ao lado do pacote (packages/cli/src/registry.ts).
      - name: Bundle Sigstore como asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$NAME-$TAG.tgz.sigstore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}
          path: |
            ${{ inputs.name }}-${{ github.ref_name }}.tgz
            ${{ inputs.name }}-${{ github.ref_name }}.tgz.sigstore
            ${{ inputs.name }}-${{ github.ref_name }}.sbom.spdx.json

  publish:
    name: Verificar e publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      NAME: ${{ inputs.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}
      - name: Verificar a atestação (assinada por este workflow)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh attestation verify "$NAME-$TAG.tgz" -R "$REPO" \
            --signer-workflow aedis-build/aedis-platform/.github/workflows/release-registry-js.yml
      - name: GitHub Release com pacote, bundle Sigstore e SBOM
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            "$NAME-$TAG.tgz" "$NAME-$TAG.tgz.sigstore" "$NAME-$TAG.sbom.spdx.json"
