# Workflow reutilizável: SAST com Semgrep (rulesets públicos + regras do Aedis). SARIF no code scanning e
# sast-summary.json (aedis.platform/sast-summary/v1). ERROR não aceito em sast-accept.yaml falha o job.
name: sast

on:
  workflow_call:
    inputs:
      platform-ref:
        type: string
        default: v1
      accept-file:
        description: Arquivo de aceites de risco (rule, path, until, reason)
        type: string
        default: sast-accept.yaml
      extra-configs:
        description: Configs Semgrep adicionais, separadas por espaço (ex. p/jwt p/sqli)
        type: string
        default: ""
    outputs:
      result:
        value: ${{ jobs.semgrep.outputs.result }}

permissions: {}

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.130.0
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Regras do aedis-platform
        if: github.repository != 'aedis-build/aedis-platform'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: aedis-build/aedis-platform
          ref: ${{ inputs.platform-ref }}
          path: .aedis-platform
          persist-credentials: false

      - name: Semgrep
        run: |
          set -euo pipefail
          rules=semgrep/rules/aedis.yml; [ -f "$rules" ] || rules=.aedis-platform/semgrep/rules/aedis.yml
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/secrets --config p/csharp --config "$rules" ${{ inputs.extra-configs }} \
            --exclude .aedis-platform --exclude semgrep/tests \
            --sarif --output sast.sarif --json-output sast.json || true

      - name: Gate
        id: gate
        run: |
          set -euo pipefail
          script=scripts/sast-summary.py; [ -f "$script" ] || script=.aedis-platform/scripts/sast-summary.py
          accept=""; [ -f "${{ inputs.accept-file }}" ] && accept="--accept ${{ inputs.accept-file }}"
          if python3 "$script" --input sast.json $accept --out sast-summary.json; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        if: always()
        with:
          sarif_file: sast.sarif
          category: semgrep

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sast-summary
          path: |
            sast-summary.json
            sast.sarif
