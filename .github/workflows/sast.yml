# Workflow reutilizável: SAST com Semgrep (rulesets públicos + regras do Aedis). SARIF no code scanning e
# sast-summary.json (aedis.platform/sast-summary/v1). ERROR não aceito em sast-accept.yaml falha o job. Com
# code-scanning: false (repositório privado sem GitHub Code Security) o gate é o mesmo, sem o upload do SARIF: os
# achados ficam no step summary e no artefato sast-summary.
name: sast

on:
  workflow_call:
    inputs:
      platform-ref:
        type: string
        default: ""
      accept-file:
        description: Arquivo de aceites de risco (rule, path, until, reason)
        type: string
        default: sast-accept.yaml
      extra-configs:
        description: Configs Semgrep adicionais, separadas por espaço (ex. p/jwt p/sqli)
        type: string
        default: ""
      code-scanning:
        description: Envia o SARIF ao code scanning (false = repositório privado sem Code Security)
        type: boolean
        default: true
    outputs:
      result:
        value: ${{ jobs.semgrep.outputs.result }}

permissions: {}

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.130.0
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regras do aedis-platform
        if: github.repository != 'aedis-build/aedis-platform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aedis-build/aedis-platform
          # v1 = última release do major; compatível por política (docs/versioning.md); passe platform-ref para fixar um SHA
          ref: ${{ inputs.platform-ref != '' && inputs.platform-ref || 'v1' }}
          path: .aedis-platform
          persist-credentials: false

      - name: Semgrep
        env:
          EXTRA_CONFIGS: ${{ inputs.extra-configs }}
        run: |
          set -euo pipefail
          rules=semgrep/rules/aedis.yml; [ -f "$rules" ] || rules=.aedis-platform/semgrep/rules/aedis.yml
          # shellcheck disable=SC2086
          semgrep scan --metrics=off --config p/owasp-top-ten --config p/secrets --config p/csharp --config "$rules" $EXTRA_CONFIGS \
            --exclude .aedis-platform --exclude semgrep/tests \
            --sarif --output sast.sarif --json-output sast.json || true

      - name: Gate
        id: gate
        env:
          ACCEPT_FILE: ${{ inputs.accept-file }}
        run: |
          set -euo pipefail
          script=scripts/sast-summary.py; [ -f "$script" ] || script=.aedis-platform/scripts/sast-summary.py
          accept=""; [ -f "$ACCEPT_FILE" ] && accept="--accept $ACCEPT_FILE"
          rc=0
          python3 "$script" --input sast.json $accept --out sast-summary.json --sarif-in sast.sarif --sarif-out sast.upload.sarif > sast-gate.txt || rc=$?
          cat sast-gate.txt
          { echo '### SAST (Semgrep)'; echo '```'; cat sast-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1
          fi

      # SARIF já sem os achados aceitos em sast-accept.yaml: o code scanning mostra só o que o gate também cobra.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && inputs.code-scanning && hashFiles('sast.upload.sarif') != ''
        with:
          sarif_file: sast.upload.sarif
          category: semgrep

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-summary
          path: |
            sast-summary.json
            sast.sarif
