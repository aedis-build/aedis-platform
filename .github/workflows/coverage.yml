# Workflow reutilizável: testes .NET com cobertura (coverlet) e gate de limiar/regressão.
# Produz coverage-summary.json (aedis.platform/coverage-summary/v1) e o relatório Cobertura como artefatos, e
# deps-summary.json (aedis.platform/deps-summary/v1) com as vulnerabilidades conhecidas das dependências
# (High/Critical não aceita em deps-accept.yaml falha o job).
name: coverage

on:
  workflow_call:
    inputs:
      solution:
        description: Solução ou projeto de testes
        type: string
        required: true
      dotnet-version:
        type: string
        default: 10.0.x
      min-line:
        description: Cobertura mínima de linhas (%)
        type: number
        default: 60
      min-branch:
        description: Cobertura mínima de branches (%)
        type: number
        default: 0
      no-regression:
        description: Falha se a cobertura de linhas cair mais de 1 ponto em relação ao último run verde do branch base (L2+)
        type: boolean
        default: false
      test-env:
        description: Variáveis de ambiente para o dotnet test, uma por linha (KEY=VALUE), ex. para ligar suítes de integração opt-in
        type: string
        default: ""
      platform-ref:
        type: string
        default: v1
      codecov:
        description: Envia o relatório Cobertura ao Codecov por OIDC (sem token; exige a GitHub App do Codecov instalada na organização)
        type: boolean
        default: false
    outputs:
      result:
        value: ${{ jobs.test.outputs.result }}

permissions: {}

jobs:
  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # só usado pelo upload ao Codecov por OIDC (inputs.codecov)
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Permite que testes com Testcontainers puxem imagens espelhadas em pacotes privados do próprio repositório.
      - name: Login no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Scripts do aedis-platform
        if: github.repository != 'aedis-build/aedis-platform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aedis-build/aedis-platform
          ref: ${{ inputs.platform-ref }}
          path: .aedis-platform
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: dotnet test com coverlet
        env:
          SOLUTION: ${{ inputs.solution }}
          TEST_ENV: ${{ inputs.test-env }}
        run: |
          set -euo pipefail
          while IFS= read -r kv; do [ -n "$kv" ] && export "$kv"; done <<< "$TEST_ENV"
          dotnet test "$SOLUTION" -c Release --nologo --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Vulnerabilidades conhecidas das dependências
        id: deps
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          set -euo pipefail
          dotnet list "$SOLUTION" package --vulnerable --include-transitive --format json > deps.json
          script=scripts/deps-summary.py; [ -f "$script" ] || script=.aedis-platform/scripts/deps-summary.py
          accept=""; [ -f deps-accept.yaml ] && accept="--accept deps-accept.yaml"
          python3 "$script" --input deps.json $accept --out deps-summary.json || echo "deps=fail" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deps-summary
          path: deps-summary.json
          if-no-files-found: ignore

      - name: Baseline do branch principal (sumário anterior)
        if: github.event_name == 'pull_request' && inputs.no-regression
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF" --workflow "$WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-summary -D baseline || echo "sem baseline"

      - name: Mesclar relatórios (um por projeto de teste conta a mesma assembly várias vezes)
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          # Saída de source generators (obj/**/*.g.cs) não é código do repositório e sai da medição.
          reportgenerator -reports:'TestResults/**/coverage.cobertura.xml' -targetdir:coverage -reporttypes:Cobertura -filefilters:'-*/obj/*;-*.g.cs'

      - name: Gate
        id: gate
        env:
          MIN_LINE: ${{ inputs.min-line }}
          MIN_BRANCH: ${{ inputs.min-branch }}
          DEPS: ${{ steps.deps.outputs.deps }}
        run: |
          set -euo pipefail
          script=scripts/coverage-gate.py; [ -f "$script" ] || script=.aedis-platform/scripts/coverage-gate.py
          baseline=""; [ -f baseline/coverage-summary.json ] && baseline="--baseline baseline/coverage-summary.json"
          if python3 "$script" --reports 'coverage/Cobertura.xml' --min-line "$MIN_LINE" --min-branch "$MIN_BRANCH" $baseline --out coverage-summary.json; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1
          fi
          [ "$DEPS" != "fail" ] || { echo "::error::dependências com vulnerabilidade High/Critical não aceita (deps-summary.json)"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage-summary.json
            coverage/Cobertura.xml
          if-no-files-found: ignore
      - name: Codecov (por OIDC)
        if: inputs.codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          use_oidc: true
          files: coverage/Cobertura.xml
          fail_ci_if_error: true
