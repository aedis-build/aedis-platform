# Corte de release por Conventional Commits, chamado pelo repositório do produto em push no branch padrão e por
# workflow_dispatch (input bump). O trabalho é da action Aedis Release Cut (aedis-build/aedis-release-cut, no
# Marketplace): a cada push, a próxima versão vem dos commits desde a última tag (breaking → major, feat → minor,
# fix/perf/refactor/revert/deps → patch, o resto não libera) e vai numa tag direto no commit (sem `version-files`:
# o aedis-dotnet e esta plataforma) ou num pull request "chore(release): vX.Y.Z" que sobe a versão dos arquivos
# (`version-files`, como o aedis-ui) e, mesclado, recebe as tags. Este reutilizável só soma o que um caller não
# deveria repetir: a guarda dos secrets e o token de curta duração da GitHub App de código do caller (secrets
# app-id e app-private-key: a App que está em trustedAuthors, ex. Aedis Agent Coder; nunca a App do portão, que
# revisa). Sem os secrets o workflow avisa e termina verde. Permissão que o caller concede: contents: read (quem
# escreve é a App).
name: release-cut

on:
  workflow_call:
    inputs:
      bump:
        description: auto (pelos commits desde a última tag) ou patch/minor/major; qualquer um dos três também corta a primeira release
        type: string
        default: auto
      tag-prefixes:
        description: Prefixos das tags separados por espaço; o primeiro nomeia a release (git describe, título do PR). Ex. "v cli-v"
        type: string
        default: v
      version-files:
        description: package.json (separados por espaço) cuja `version` acompanha a release; o primeiro é a versão atual. Vazio tagueia direto
        type: string
        default: ""
      pin-dependency:
        description: Dependência que, dentro de version-files, é pinada exatamente na versão da release (ex. "@aedis/cli")
        type: string
        default: ""
      version-source:
        description: Arquivo fonte que declara a versão (ex. packages/cli/src/cli.ts); exige version-source-pattern
        type: string
        default: ""
      version-source-pattern:
        description: 'Texto literal com {version} no lugar da versão, ex. ''export const VERSION = "{version}";'''
        type: string
        default: ""
      pin-pattern:
        description: Prefixo literal cujas ocorrências `<pin-pattern><versão atual>` nos arquivos versionados passam à nova (ex. "@aedis/cli@"); lockfiles ficam de fora
        type: string
        default: ""
      lockfile-command:
        description: Comando que refaz o lockfile depois do bump (ex. "pnpm install --lockfile-only"); vazio para nenhum
        type: string
        default: ""
      node-version:
        type: string
        default: "22"
      platform-ref:
        description: "Ignorado: os scripts vêm da action aedis-release-cut. Removido em v2"
        type: string
        default: ""
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true
    outputs:
      tag:
        description: Primeira tag empurrada nesta execução (vazio quando só houve PR, ou nada a liberar)
        value: ${{ jobs.cut.outputs.tag }}

permissions: {}

jobs:
  cut:
    name: Tag a merged release, or propose the next one
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      # Os secrets da App são de organização, concedidos por repositório. Sem eles nada pode ser tagueado nem aberto,
      # então o workflow diz isso e termina verde em vez de falhar a cada push.
      - name: The App's credentials reach this repository
        id: guard
        env:
          APP_ID: ${{ secrets.app-id }}
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: |
          [ -z "$PLATFORM_REF" ] || echo "::warning::deprecated: platform-ref is removed in v2; the aedis-release-cut action carries its scripts"
          if [ -z "$APP_ID" ]; then
            echo "::warning::app-id is empty (organization secret, selected repositories): release-cut does nothing until it reaches this repository"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.guard.outputs.enabled == 'true'
        id: app
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - uses: aedis-build/aedis-release-cut@379a92c16289c4e30cfc3a6d08c45d1ce96b9752 # repin to v1.0.0 once released
        if: steps.guard.outputs.enabled == 'true'
        id: cut
        with:
          token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          bump: ${{ inputs.bump }}
          tag-prefixes: ${{ inputs.tag-prefixes }}
          version-files: ${{ inputs.version-files }}
          pin-dependency: ${{ inputs.pin-dependency }}
          version-source: ${{ inputs.version-source }}
          version-source-pattern: ${{ inputs.version-source-pattern }}
          pin-pattern: ${{ inputs.pin-pattern }}
          lockfile-command: ${{ inputs.lockfile-command }}
          node-version: ${{ inputs.node-version }}
