# Release desta plataforma: a publicação oficial dos workflows reutilizáveis e das actions compostas. A cada push em
# main, a próxima versão vem dos Conventional Commits desde a última tag (release-cut.yml, o mesmo reutilizável que
# os repositórios chamam) e a tag vX.Y.Z vai direto no commit, sem PR: a versão da plataforma só existe na tag. É
# essa tag que os callers pinam (`@<sha> # vX.Y.Z`) e que o Dependabot (ecossistema github-actions) acompanha para
# abrir o repin sozinho. A primeira tag sai de uma execução manual com bump explícito; depois, só o que libera (feat,
# fix, deps, breaking) gera tag.
#
# Em cima da tag, o release-tag.yml (reutilizável, o mesmo que as actions do Aedis chamam): GitHub Release com as
# notas geradas dos Conventional Commits (scripts/release-notes.py), conferida como imutável e atestada pelo GitHub
# (`gh release verify`); a tag maior móvel `v1` (para humanos e docs, nunca num `uses:`); e um pull request
# `docs(changelog)` que regenera CHANGELOG.md a partir de todas as releases, sempre o mesmo PR, mesclado quando
# convier (main só recebe PR, então o changelog não é empurrado direto).
#
# Tag, release e PR saem como a App de código (Aedis Agent Coder, secrets AEDIS_CODER_APP_*), que está em
# trustedAuthors; nunca como a App do portão (Aedis Compliance), que é quem revisa e não pode revisar PR própria.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento (auto = pelos commits desde a última tag; patch/minor/major também cortam a primeira release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    uses: ./.github/workflows/release-cut.yml
    permissions:
      contents: read
    with:
      bump: ${{ inputs.bump || 'auto' }}
    secrets:
      app-id: ${{ secrets.AEDIS_CODER_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_CODER_APP_PRIVATE_KEY }}

  publish:
    needs: cut
    if: needs.cut.outputs.tag != ''
    uses: ./.github/workflows/release-tag.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets:
      app-id: ${{ secrets.AEDIS_CODER_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_CODER_APP_PRIVATE_KEY }}
