# Portão de merge deste repositório: a cada run do CI concluída numa PR, e a cada aprovação humana (review-signal),
# avalia a política e aprova como a App.
# Roda a partir da main (workflow_run) e não toca o código da PR.
name: gate

on:
  workflow_run:
    workflows: [ci, review-signal]
    types: [completed]

permissions: {}

jobs:
  gate:
    if: contains(fromJSON('["pull_request", "pull_request_review"]'), github.event.workflow_run.event)
    uses: ./.github/workflows/merge-gate.yml
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      app-id: ${{ secrets.AEDIS_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_APP_PRIVATE_KEY }}
